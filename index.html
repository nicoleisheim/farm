<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
b,strong,h2{font-weight:600}
button,input,kbd,small{font-family:inherit;font-variant-numeric:tabular-nums}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;touch-action:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:radial-gradient(circle at 50% 30%,#6a3d5e,#26121f 75%);font-family:'VT323',ui-rounded,'Arial Rounded MT Bold','Nunito',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-weight:500;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
#app{position:fixed;top:0;left:0;width:100%;height:100%;touch-action:none;display:flex;align-items:center;justify-content:center;font-size:14px}
#stage{position:relative;flex:none}

#bottom{position:absolute;left:0;right:0;bottom:.6em;display:flex;justify-content:center;pointer-events:none}

#ebar{flex:1;width:100%;background:#6a3a4a;border-radius:.2em;position:relative;overflow:hidden}

#hotbar{display:flex;gap:.3em;padding:.35em;border-radius:1.2em}
.slot{width:2.9em;height:2.9em;background:#fff0f6;border:.16em solid #f5a3c3;border-radius:.9em;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s;touch-action:manipulation}

.slot .n{position:absolute;right:-.15em;bottom:-.15em;min-width:1.5em;padding:.12em .3em;border-radius:1em;background:#fff;border:.12em solid #f5a3c3;font-weight:600;font-size:.72em;line-height:1;text-align:center;color:#c4527e;pointer-events:none}
.slot .k{position:absolute;left:.45em;top:.25em;font-size:.6em;line-height:1;font-weight:600;color:#e07aa2;pointer-events:none}
.slot .wl{position:absolute;left:.5em;right:.5em;bottom:.3em;height:.28em;background:#6a3a4a;border-radius:.1em;overflow:hidden;pointer-events:none}
.slot .wl i{display:block;height:100%;background:#4fb3ff}
#hint{position:absolute;left:50%;bottom:5.5em;transform:translateX(-50%);padding:.2em .6em;font-size:.85em;font-weight:600;white-space:nowrap;display:none;pointer-events:none}
#hint kbd{font-family:inherit;background:#e0578c;color:#fff;border-radius:.2em;padding:0 .3em;margin-right:.3em}
#toast{position:absolute;left:50%;bottom:7.6em;transform:translateX(-50%) translateY(.4em);padding:.35em .8em;font-weight:600;width:max-content;max-width:94%;text-align:center;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}

#dlg{width:min(94%,31em);max-height:92%;overflow:auto;touch-action:pan-y;overscroll-behavior:contain;padding:.9em 1.2em 1em;-webkit-overflow-scrolling:touch}

#dlg kbd{font-family:inherit;background:#e0578c;color:#fff;border-radius:.2em;padding:0 .3em}
.btn{font:inherit;font-weight:600;background:#ffb3cf;border:.14em solid #7a4a2a;border-radius:.7em;padding:.3em .8em;color:#5a2a35;cursor:pointer;box-shadow:0 .15em 0 #7a4a2a;touch-action:manipulation}
.btn:hover:not(:disabled){background:#ffc8dc}
.btn:active:not(:disabled){transform:translateY(.1em);box-shadow:0 .05em 0 #7a4a2a}

.row{display:flex;align-items:center;gap:.5em;padding:.45em 0;border-bottom:.1em dashed #ec9dbd}
.row img{width:2.1em;height:2.1em;image-rendering:pixelated}
.row .info{flex:1;display:flex;flex-direction:column;line-height:1.2;min-width:6.5em}
.row{flex-wrap:wrap}
.row small{opacity:.75}
.qty{display:flex;align-items:center;gap:.25em}
#dlg.pixdlg{background:none;border:0;box-shadow:none;padding:0;width:min(96%,30em);border-radius:0}
.pwin{border:.75em solid transparent;border-image:var(--t-win) 4 / .75em stretch;image-rendering:pixelated;position:relative}

.p-sign{position:absolute;top:.45em;left:50%;transform:translateX(-50%);z-index:3;border:.5em solid transparent;border-image:var(--t-sign) 4 fill / .5em stretch;color:#fff7ec;font-weight:600;padding:0 .5em;white-space:nowrap;text-shadow:0 .1em 0 #7a4a2a;filter:drop-shadow(0 .2em 0 rgba(61,34,12,.35))}
.pstall{background:#f7e6cf}
.p-back{position:relative;background:var(--t-plank) repeat 0 0/3em 3em;padding:1.6em 1.3em .1em;min-height:9.5em;display:flex;flex-direction:column;align-items:flex-start;margin-top:-.6em}
.p-back:before,.p-back:after{content:'';position:absolute;top:0;bottom:0;width:.9em;background:var(--t-post) repeat-y 0 0/.9em 1.2em}
.p-back:before{left:0}.p-back:after{right:0}
.p-chalk{border:.6em solid transparent;border-image:var(--t-chalk) 4 fill / .6em stretch;color:#f3f7ef;font-size:.78em;line-height:1.4;padding:0 .3em;margin-left:.4em}
.p-goods{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.3em .7em;margin-top:auto;align-self:stretch;min-height:3.6em;padding:0 .6em}

.p-tag{position:absolute;top:-.2em;right:-.7em;z-index:2;border:.25em solid transparent;border-image:var(--t-tag) 4 fill / .25em stretch;font-size:.62em;font-weight:600;color:#5a2a35;padding:0 .15em;transform:rotate(8deg)}
.p-crate.sel img{filter:drop-shadow(0 0 .12em #ff4f8b) drop-shadow(0 0 .12em #ff4f8b)}

.p-counter{height:2.25em;background:var(--t-counter) repeat-x 0 0/3em 2.25em;text-align:center;color:#fff7ec;font-size:.7em;line-height:3.9em;text-shadow:0 .1em 0 #8a5a40;position:relative;z-index:1}
.p-lower{padding:.9em .7em .2em;background:#f7e6cf}
.p-basket{position:relative;border:.6em solid transparent;border-image:var(--t-rim) 4 / .6em stretch;background:var(--t-weave) repeat 0 0/1.5em 1.5em;background-clip:padding-box;padding:1em .4em .5em;margin-top:.4em}
.p-label{position:absolute;top:-1.15em;left:.4em;border:.4em solid transparent;border-image:var(--t-sign) 4 fill / .4em stretch;color:#fff7ec;font-size:.8em;font-weight:600;padding:0 .3em}
.p-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(4em,1fr));gap:.4em}
.p-slot{position:relative;border:.5em solid transparent;border-image:var(--t-slot) 4 fill / .5em stretch;text-align:center;cursor:pointer;padding:.1em 0 0}
.p-slot.sel{border-image-source:var(--t-slotsel)}
.p-slot img{width:2.2em;height:2.2em;display:block;margin:0 auto}
.p-n{position:absolute;top:-.55em;right:-.55em;border:.25em solid transparent;border-image:var(--t-slotsel) 4 fill / .25em stretch;font-size:.66em;font-weight:600;color:#c4527e;min-width:1.2em;text-align:center;line-height:1.1}
.p-sn{font-size:.68em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-flag{position:absolute;top:-.95em;left:-.6em;z-index:1;background:#ffe066;color:#7a4a1e;font-size:.55em;font-weight:600;padding:.05em .35em;box-shadow:0 0 0 .15em #c99a2a}
.p-empty{font-size:.8em;opacity:.7;text-align:center;flex:1;align-self:center;color:#7a4a2a;padding:.8em 0}

.p-paper{border:.5em solid transparent;border-image:var(--t-paper) 4 fill / .5em stretch}
.p-abar{display:flex;align-items:center;gap:.4em .5em;flex-wrap:wrap;margin-top:.7em;padding:.1em .2em}

.p-abar .an small{opacity:.75}
.p-qty{display:flex;align-items:center;gap:.25em}
.p-warn{font-size:.76em;color:#c4527e;margin:.35em .2em 0}
.p-foot{display:flex;justify-content:flex-end;padding:.7em .1em .2em}
.p-foot.wood{background:#e8c69e;margin:0;padding:.55em .5em}
.pbtn{font:inherit;font-weight:600;color:#fff;text-shadow:0 .1em 0 #a0365e;background:none;border:.45em solid transparent;border-image:var(--t-btn) 4 fill / .45em stretch;padding:0 .4em;cursor:pointer;line-height:1.5;touch-action:manipulation;image-rendering:pixelated}
.pbtn:active:not(:disabled){transform:translateY(.1em)}
.pbtn.sec{color:#5a2a1a;text-shadow:none;border-image-source:var(--t-btn2)}
.pbtn:disabled{border-image-source:var(--t-btnoff);color:#b7909f;text-shadow:none;cursor:default}
.pbtn.sq{min-width:2.2em;padding:0}
.pbtn.sm{font-size:.82em;min-width:3.2em}
.qv{min-width:1.6em;text-align:center;font-weight:600}
.pboard{background:#d6a06a}
.p-cork{background:var(--t-cork) repeat 0 0/3em 3em;padding:2.6em .8em .8em;display:flex;flex-direction:column;gap:1em;min-height:9em}
.p-note{position:relative;border:.55em solid transparent;border-image:var(--t-paper) 4 fill / .55em stretch;padding:.25em .35em .1em;filter:drop-shadow(.15em .25em 0 rgba(90,52,22,.35))}
.p-note.done{border-image-source:var(--t-green)}
.p-pin{position:absolute;top:-1em;left:50%;width:1.3em;height:1.3em;margin-left:-.65em;background:var(--t-pin) no-repeat 0 0/100% 100%}
.nh{display:flex;justify-content:space-between;align-items:center;gap:.5em;margin-bottom:.3em}
.p-stamp{font-size:.7em;font-weight:600;color:#c4527e;border:.18em solid #f5a3c3;padding:0 .4em;transform:rotate(-3deg);white-space:nowrap;background:#fff}
.p-stamp.hot{color:#d94a3a;border-color:#f0a090}
.p-stamp.ok{color:#3f8a37;border-color:#8fd16a;font-size:.8em;text-transform:uppercase;letter-spacing:.06em}
.nl{display:flex;align-items:center;gap:.45em;padding:.2em 0}
.nl img{width:2em;height:2em;flex:none}
.nm{flex:1;min-width:0}
.nt{display:flex;justify-content:space-between;font-size:.86em}
.p-bar{height:.55em;background:#efe2cc;box-shadow:0 0 0 .14em #c9a87e;margin:.25em .1em .1em;position:relative}
.p-bar i{position:absolute;left:0;top:0;bottom:0;background:#7cc85a;box-shadow:inset 0 .14em 0 #a6e08a}
.p-check{color:#3f8a37;font-weight:600;min-width:3.2em;text-align:center}
.nf{display:flex;justify-content:space-between;align-items:center;border-top:.14em dashed #e0cfb4;margin-top:.3em;padding-top:.25em;font-size:.9em}
.nf b{display:flex;align-items:center;gap:.25em}
.p-coin{display:inline-block;width:1em;height:1em;background:var(--t-coin) no-repeat 0 0/100% 100%}
.p-cratebar{display:flex;align-items:center;gap:.6em;background:#c98a5a;color:#fff7ec;font-size:.76em;padding:.5em .7em;text-shadow:0 .1em 0 #7a4a2a;border-top:.25em solid #8a5a40}
.p-cicon{flex:none;width:2.6em;height:1.5em;background:var(--t-crate) no-repeat 0 0/100% 100%}
.stall{margin:0 -1.2em .7em;position:relative}
.awning{height:2.2em;background:repeating-linear-gradient(90deg,#ff8fb8 0 2em,#fff 2em 4em);border-top:.35em solid #a86d48;position:relative;z-index:1;box-shadow:inset 0 -.25em 0 rgba(0,0,0,.06)}
.awning:after{content:'';position:absolute;left:0;right:0;bottom:-1em;height:1em;background:radial-gradient(circle at 50% 0,#ff8fb8 .97em,transparent 1em) 0 0/4em 1em repeat-x,radial-gradient(circle at 50% 0,#fff .97em,transparent 1em) 2em 0/4em 1em repeat-x;filter:drop-shadow(0 .15em 0 rgba(120,40,70,.18))}
.stallsign{position:absolute;top:.55em;left:50%;transform:translateX(-50%);z-index:2;background:#c98a5a;color:#fff7ec;border:.15em solid #7a4a2a;border-radius:.45em;padding:.1em .9em;font-weight:600;white-space:nowrap;box-shadow:0 .2em 0 #7a4a2a}
.stallbody{position:relative;padding:0 1.25em}
.stallbody:before,.stallbody:after{content:'';position:absolute;top:-.5em;bottom:0;width:.75em;background:linear-gradient(90deg,#a86d48,#d39a64 45%,#a86d48);z-index:0}
.stallbody:before{left:.3em}.stallbody:after{right:.3em}
.wall{background:repeating-linear-gradient(180deg,#f2d3ae 0 1.5em,#e3bb8c 1.5em 1.62em);padding:1.6em .6em .1em;position:relative;min-height:9em;display:flex;flex-direction:column;align-items:flex-start}
.chalk{background:#41604e;color:#f3f7ef;border:.25em solid #a86d48;border-radius:.3em;padding:.3em .6em;font-size:.74em;line-height:1.35;display:inline-block;box-shadow:0 .15em 0 rgba(0,0,0,.15);margin-bottom:.4em}
.goods{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.4em .55em;min-height:3.6em;margin-top:auto;align-self:stretch;padding:0 .2em}
.emptychalk{font-size:.8em;opacity:.65;padding:.6em 0;flex:1;text-align:center}
.crate{position:relative;width:3.6em;text-align:center;cursor:pointer}

.crate.sel img{filter:drop-shadow(0 0 .15em #ff4f8b)}

<script>
(() => {

for (let x = 2; x <= 6; x++) for (let y = 2; y <= 5; y++) setT(x, y, 'H');
for (let x = 17; x <= 21; x++) for (let y = 2; y <= 5; y++) setT(x, y, 'H');

for (let x = 10; x <= 13; x++) for (let y = 10; y <= 13; y++) setT(x, y, 'P');

[[3, 11], [4, 11], [5, 11], [3, 12], [4, 12], [5, 12], [17, 11], [18, 11], [19, 11], [20, 11], [2, 6], [3, 6], [5, 6], [6, 6], [17, 6], [18, 6], [20, 6], [21, 6]].forEach(([x, y]) => setT(x, y, 'O'));

const TOWN_NPC = [{ x: 4, y: 13, p: 1, d: 'up', say: ['Schöner Tag heute!', 'Die Kirschbäume blühen so schön.', 'Warst du schon im Dorfladen?'] },
  { x: 15, y: 12, p: 3, d: 'left', say: ['Deine Rüben sind die besten im Dorf!', 'Früher war hier alles nur Wiese.', 'Am Brunnen ist es abends so gemütlich.'] }];
TOWN_NPC.forEach(n => setT(n.x, n.y, 'N'));

/* ---------- tile art ---------- */
function heart(g, x, y, c) { R(g, x, y, 2, 1, c); R(g, x + 3, y, 2, 1, c); R(g, x, y + 1, 5, 1, c); R(g, x + 1, y + 2, 3, 1, c); R(g, x + 2, y + 3, 1, 1, c); }

}
const isPT = (a, b) => tileAt(a, b) === 'P';
const connT = (a, b) => { const t = tileAt(a, b); return t === 'P' || t === 'H' || t === 'S' || t === 'B' || t === 'L' || t === 'F'; };
function pathPix(x, y) {
  const tx = Math.floor(x / 16), ty = Math.floor(y / 16), lx = x - tx * 16, ly = y - ty * 16;

function drawPaths(g) {

const isCherry = (tx, ty) => { const st = TREES[tx + ',' + ty]; return st && st.k ? st.k === 'cherry' : hash(tx, ty, 21) < .4; };

const KEY = 'sonnenhof-v1';
function newState() {
  const bar = ['hoe', 'can', 'sickle', 'axe', 'shovel', 'seed-ruebe', 'snack', null];
  return { day: 1, time: 360, gold: 150, energy: 100, maxEnergy: 100, water: 20, canCap: 20, rain: false,
    items: { hoe: 1, can: 1, sickle: 1, axe: 1, shovel: 1, 'seed-ruebe': 15, snack: 2 }, dura: {}, bar, bag: Array(BAG_N).fill(null),
    stand: {}, sold: {}, soldGold: 0, trees: {}, orders: [{ id: 'o1', who: 'Frau Lind', items: { ruebe: 3 }, packed: {}, days: 4, reward: 200 }], soil: {}, sel: 0, px: 72, py: 93, dir: 'down', warned: false, earned: 0 };
}
function migrate(d) {
  if (d.bar) return migrate2(d);
  const items = { hoe: 1, can: 1, sickle: 1 };
  for (const t in CROPS) {
    if (d.seeds && d.seeds[t]) items['seed-' + t] = d.seeds[t];
    if (d.produce && d.produce[t]) items[t] = d.produce[t];
  }
  if (d.snacks) items.snack = d.snacks;
  d.items = items; d.bar = Array(BAR_N).fill(null); d.bag = Array(BAG_N).fill(null);
  ['hoe', 'can', 'sickle', 'seed-ruebe', 'seed-kohl', 'seed-kuerbis', 'snack'].filter(i => items[i]).forEach((id, i) => d.bar[i] = id);
  Object.keys(CROPS).filter(t => items[t]).forEach((t, i) => d.bag[i] = t);
  d.sel = 0; delete d.seeds; delete d.produce; delete d.snacks;
  return migrate2(d);
}
function migrate2(d) {
  if (!d.prices) d.prices = {};
  for (const id of ['axe', 'shovel']) if (!d.items[id]) {
    d.items[id] = 1;
    for (const c of ['bar', 'bag']) { const i = d[c].indexOf(null); if (i >= 0) { d[c][i] = id; break; } }
  }
  d.dura = d.dura || {};
  d.stand = d.stand || {}; d.sold = d.sold || {}; d.soldGold = d.soldGold || 0; d.trees = d.trees || {};
  if (!d.orders) d.orders = [{ id: 'o1', who: 'Frau Lind', items: { ruebe: 3 }, packed: {}, days: 4, reward: 200 }];
  if (d.shipped) { for (const t in d.shipped) if (d.shipped[t]) d.stand[t] = (d.stand[t] || 0) + d.shipped[t]; delete d.shipped; }
  return d;
}

function buy(id, n) {

/* ---------- day cycle ---------- */
let fading = false;

  if (fading) return;
  fading = true; paused = true; $('fade').style.opacity = 1;
  setTimeout(() => {
    let lines = '';
    for (const t of SELLABLE) {
      const n = S.sold[t]; if (!n) continue;
      lines += `<div class="kv"><img src="${ICONURL[iconOf(t)]}" alt=""><span>${n}× ${ITEM[t].name}</span><b>${(n * priceOf(t)).toLocaleString('de-DE')} Taler</b></div>`;
    }

    const hrs = Math.round((S.staffMin || 0) / 60 * 10) / 10, wage = Math.min(Math.round(hrs * wageOf()), S.gold); S.gold -= wage; S.staffMin = 0; delete S.staffed;

      if (orderReady(o)) { S.gold += o.reward; S.earned += o.reward; dl += `<div class="kv"><img src="${ICONURL.board}" alt=""><span>Lieferung an ${o.who}</span><b>+${o.reward.toLocaleString('de-DE')} Taler</b></div>`; S.orders.splice(S.orders.indexOf(o), 1); continue; }

        for (const t in o.packed) if (o.packed[t]) addItem(t, o.packed[t]);
        dl += `<div class="kv muted"><img src="${ICONURL.board}" alt=""><span>Bestellung von ${o.who} abgelaufen – Ware ist zurück im Rucksack</span><b>–</b></div>`;
        S.orders.splice(S.orders.indexOf(o), 1);
      }
    }
    let fresh = [];
    if (!S.orders.length) { const o = genOrder(); S.orders.push(o); fresh.push(o.who); }
    while (S.orders.length < 3 && Math.random() < .55) { const o = genOrder(); S.orders.push(o); fresh.push(o.who); }
    // Bäume
    let regrow = false;
    for (const k in TREES) {
      const st = TREES[k];
      if (st.s === 'tree') { if (st.k) delete st.hp; else delete TREES[k]; }
      else if (st.s === 'stump') delete st.d;
      else if (st.s === 'sap' && ++st.d >= 4) { st.s = 'tree'; delete st.d; regrow = true; }
      else if (st.s === 'bush') { st.d++; if (!st.ripe) { st.c = (st.c || 0) + 1; if (st.d === 3 || (st.d > 3 && st.c >= 2)) { st.ripe = true; st.c = 0; } } }
    }
    rebuildTrees();
    let lost = 0;
    if (passedOut) { lost = Math.min(Math.floor(S.gold * .1), 500); S.gold -= lost; }
    let grown = 0;
    for (const k in S.soil) {
      const s = S.soil[k];
      if (s.c) { if (s.w && s.c.d < CROPS[s.c.t].days) { s.c.d++; grown++; } }
      s.w = false;
    }
    S.day++; S.rain = Math.random() < .22;
    if (S.rain) for (const k in S.soil) S.soil[k].w = true;
    S.energy = passedOut ? Math.round(S.maxEnergy * .6) : S.maxEnergy;
    LOC = 'farm'; S.time = 360; S.warned = false; S.px = 72; S.py = 93; S.dir = 'down';
    save();
    const ready = Object.values(S.soil).filter(s => s.c && s.c.d >= CROPS[s.c.t].days).length;

/* ---------- update ---------- */
let animT = 0, moving = false;
function blocked(x, y) { return wetAt(x, y) || SOLID.has(tileAt(Math.floor(x / 16), Math.floor(y / 16))); }

function moveAxis(dx, dy, other) {

  if (Math.abs(other) > .35) return;
  const step = Math.abs(dx || dy);
  for (let n = 1; n <= 6; n++) for (const sg of [-1, 1]) {
    const ox = dx ? 0 : sg * n, oy = dx ? sg * n : 0;

function update(dt) {
  if (actT > 0) actT -= dt;
  if (fadeT > 0) fadeT = Math.max(0, fadeT - dt);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.h) p.vy *= .985; else if (p.pt) { p.x += Math.sin(p.life * 3 + p.s) * 10 * dt; } else p.vy += 160 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (const [tx, ty] of (LOC === 'farm' ? CHERRY : TOWN_TREES.filter((_, i) => i % 2 === 0))) if (Math.random() < dt * .18 && parts.length < 160)
    parts.push({ x: tx * 16 + 3 + Math.random() * 10, y: ty * 16 + 6 + Math.random() * 6, vx: -5 - Math.random() * 6, vy: 7 + Math.random() * 5,
      life: 2.5 + Math.random() * 2, col: Math.random() < .5 ? '#ffc2dc' : '#ffe3ee', pt: 1, s: Math.random() * 6 });
  if (LOC === 'farm') { updateCritters(dt); updatePond(dt); }
  if (!paused) updateCustomers(dt);
  if (S.rain) for (const d of rain) { d.y += d.s * dt; d.x -= d.s * .25 * dt; if (d.y > VH) { d.y = -4; d.x = Math.random() * (VW + 60); } }
  if (paused) { moving = false; return; }
  let tx = 0, ty = 0;
  if (keys.has('l')) tx--; if (keys.has('r')) tx++; if (keys.has('u')) ty--; if (keys.has('d')) ty++;
  if (tx && ty) { tx *= .7071; ty *= .7071; }
  if (joy) {
    const m = Math.hypot(joy.vx, joy.vy);
    if (m > .15) { const sp = .4 + .6 * Math.min(1, (m - .15) / .55); tx = joy.vx / m * sp; ty = joy.vy / m * sp; }
  }

  if (!tx && Math.abs(vel.x) < .03) vel.x = 0; if (!ty && Math.abs(vel.y) < .03) vel.y = 0;

}

  if (farm) for (const k in S.soil) {
    const s = S.soil[k]; if (!s.c) continue;
    const [tx, ty] = k.split(',').map(Number), v = cropStage(s.c);
    drawCrop(X, s.c.t, v, tx * 16, ty * 16);
    if (v === 4 && Math.floor(t * 2 + hash(tx, ty, 5) * 3) % 3 === 0) heart(X, tx * 16 + 10, ty * 16 + 1 - Math.floor(t * 4 % 2), '#ff5f8f');
  }
  if (!paused) {
    let ct = targetTile();
    if (mouseTile && inReach(...mouseTile)) ct = mouseTile;
    corners(ct[0] * 16, ct[1] * 16);
  }
  const night = S.time > 1200;
  const buns = farm ? critters.filter(c => c.k === 'bun') : [], cs = farm ? custs : [];
  for (const c of buns) if (c.y <= S.py) drawBunny(c);
  for (const c of cs) if (c.y <= S.py) drawCustomer(c);
  // player
  const f = moving ? Math.floor(animT * 8) % 4 : 0;
  const flip = S.dir === 'left';
  drawPlayerSprite(pg, flip ? 'right' : S.dir, f);
  const ox = Math.round(S.px) - 8, oy = Math.round(S.py) - 19 - (moving && f % 2 ? 1 : 0);
  R(X, Math.round(S.px) - 5, Math.round(S.py) - 2, 10, 2, 'rgba(0,0,0,.25)');
  if (flip) { X.save(); X.translate(ox + 16, oy); X.scale(-1, 1); X.drawImage(PC, 0, 0); X.restore(); }
  else X.drawImage(PC, ox, oy);
  // tool swing
  if (actT > 0 && actTool) {
    const d = DIRS[S.dir], lift = actT > .14 ? -5 : 0;
    const ix = Math.round(S.px - 8 + d[0] * 9), iy = Math.round(S.py - 16 + d[1] * 6 + lift);
    if (S.dir === 'left') { X.save(); X.translate(ix + 16, iy); X.scale(-1, 1); X.drawImage(ICON[actTool], 0, 0); X.restore(); }
    else X.drawImage(ICON[actTool], ix, iy);
  }
  for (const c of buns) if (c.y > S.py) drawBunny(c);
  for (const c of cs) if (c.y > S.py) drawCustomer(c);
  for (const p of parts) {
    if (p.h) heart(X, Math.round(p.x) - 2, Math.round(p.y) - 2, p.col);
    else R(X, Math.round(p.x), Math.round(p.y), p.pt ? (p.s > 3 ? 2 : 1) : 2, p.pt ? 1 : 2, p.col);
  }
  if (farm && !night && !S.rain) for (const c of critters) if (c.k === 'fly') drawFly(c, false);
  X.restore();
  // light
  const tm = S.time;
  let dark = 0;
  if (tm > 1080) dark = Math.min(.55, (tm - 1080) / 240 * .55);
  if (tm > 1000 && tm < 1200) { X.fillStyle = `rgba(255,140,40,${.12 * Math.sin((tm - 1000) / 200 * Math.PI)})`; X.fillRect(0, 0, VW, VH); }
  if (S.rain) {
    X.fillStyle = 'rgba(40,60,90,.22)'; X.fillRect(0, 0, VW, VH);
    X.fillStyle = 'rgba(190,215,255,.55)';
    for (const d of rain) { X.fillRect(Math.round(d.x), Math.round(d.y), 1, 4); }
  }
  if (dark > 0) {
    X.fillStyle = `rgba(48,22,86,${dark})`; X.fillRect(0, 0, VW, VH);
    if (!farm) for (const [lx, ly] of TOWN_LAMPS) { X.fillStyle = `rgba(255,210,120,${dark * .5})`; X.fillRect(lx * 16 + 2 - camX, ly * 16 - 8 - camY, 12, 12); X.fillStyle = `rgba(255,230,160,${Math.min(1, dark * 2)})`; X.fillRect(lx * 16 + 6 - camX, ly * 16 - 2 - camY, 4, 4); }
    for (const [wx, wy, w, h] of (farm ? WINDOWS : TWIN)) {
      const x = wx - camX, y = wy - camY;
      X.fillStyle = `rgba(255,200,90,${Math.min(1, dark * 2)})`; X.fillRect(x, y, w, h);
      X.fillStyle = `rgba(255,190,80,${dark * .35})`; X.fillRect(x - 3, y + h, w + 6, 6);
    }
    if (farm && S.time > 1200 && !S.rain) drawFireflies();
  }
  if (fadeT > 0) { X.fillStyle = `rgba(38,18,31,${fadeT / .35})`; X.fillRect(0, 0, VW, VH); }
}

/* ---------- layout & loop ---------- */
function fit() {
  const vv = window.visualViewport;
  const iw = Math.round(vv ? vv.width : innerWidth), ih = Math.round(vv ? vv.height : innerHeight), port = touchMode && ih > iw;
  document.body.classList.toggle('touch', touchMode);
  document.body.classList.toggle('port', port);
  const app = $('app'), stage = $('stage'), top = $('topbar'), bot = $('bottom'), ctrl = $('ctrl');
  app.style.height = ih + 'px';
  let s;
  if (port) {
    const fs = Math.min(16, iw / 26);
    app.style.fontSize = fs + 'px';
    app.insertBefore(top, stage); stage.after(bot); bot.appendChild(ctrl);
    VW = 240; s = iw / VW;
    const cs = getComputedStyle(bot), gap = parseFloat(cs.rowGap) || 0;
    const need = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + gap * 2 +
      $('hotbar').offsetHeight + $('energy').offsetHeight + Math.max($('joy').offsetHeight, $('abtn').offsetHeight) + fs * .6;
    VH = Math.max(96, Math.min(H, Math.floor((ih - top.offsetHeight - need) / s)));
    stage.style.width = iw + 'px'; stage.style.height = VH * s + 'px';
  } else {
    stage.insertBefore(top, $('hint')); stage.appendChild(bot); app.insertBefore(ctrl, $('fade'));
    VW = W; VH = H;
    s = Math.min(iw / W, ih / H) * .97;
    if (s >= 2 && !touchMode) s = Math.floor(s);
    app.style.fontSize = (touchMode ? Math.max(10, Math.min(15, s * 4.3)) : Math.max(9, Math.min(18, s * 4.6))) + 'px';
    stage.style.width = W * s + 'px'; stage.style.height = H * s + 'px';
  }
  if (C.width !== VW || C.height !== VH) { C.width = VW; C.height = VH; X.imageSmoothingEnabled = false; }
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 200));
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
fit(); if (document.fonts) document.fonts.ready.then(fit);
buildHotbar();
if (firstRun) openDlg(helpHTML(true));
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render(now / 1000); updateHUD();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
