<script>
(() => {
'use strict';

const curH = () => LOC === 'town' ? TH : H;
const C = document.getElementById('c'), X = C.getContext('2d');
X.imageSmoothingEnabled = false;
const $ = id => document.getElementById(id);
let VW = W, VH = TH, camX = 0, camY = 0, HUDB = 0, HUDT = 0;
let touchMode = matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window);
let padMode = navigator.userAgent.includes('SonnenhofApp');
const tmode = () => touchMode && !padMode;
// Anzeigegröße, selbst einstellbar in der Hilfe (Start-Taste / ?)

try { Object.assign(UIS, JSON.parse(localStorage.getItem('sonnenhof-ui') || '{}')); } catch (e) {}
function applyUI() { $('bottom').style.fontSize = UIS.bar * 100 + '%'; $('topbar').style.fontSize = UIS.top * 100 + '%'; $('dlg').style.fontSize = UIS.dlg * (padMode ? 115 : 100) + '%'; }

/* ---------- helpers ---------- */
function R(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function disc(g, cx, cy, r, c) {
  g.fillStyle = c;
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.round(Math.sqrt(Math.max(0, r * r - dy * dy)));

}
function hash(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 982451653)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }

/* ---------- game data ---------- */
const CROPS = {
  ruebe:   { name: 'Weizen', seed: 'Weizensamen', days: 2, buy: 20, sell: 35,  eat: 15 },   // Schlüssel bleiben (Spielstände)
  kohl:    { name: 'Rübe',   seed: 'Rübensamen',   days: 3, buy: 45, sell: 90,  eat: 30 },

  hoe: { name: 'Hacke', kind: 'hoe', tool: 1, dura: 60, price: 80, desc: 'Lockert Gras zu Ackerboden auf. Kostet 2 Energie.' },

  shovel: { name: 'Schaufel', kind: 'shovel', tool: 1, dura: 40, price: 70, desc: 'Gräbt Pflanzen aus und macht Felder wieder zu Wiese.' },

  'sap-green': { name: 'Baumsetzling', kind: 'sapling', k: 'green', desc: 'Auf freier Wiese pflanzen. Wird in 4 Tagen zu einem Baum.' },
  'sap-berry': { name: 'Beerenstrauch', kind: 'sapling', k: 'berry', desc: 'Auf freier Wiese pflanzen. Trägt nach 3 Tagen Beeren, danach alle 2 Tage.' },

}
const BAR_N = 8, BAG_N = 16;
const TOOLS = ['hoe', 'can', 'sickle', 'axe', 'shovel'];
function wear(id) {
  if (!S.dura) S.dura = {};
  if (S.dura[id] === undefined) S.dura[id] = ITEM[id].dura;
  S.dura[id]--;
  if (S.dura[id] === 10) toast(`${itemName(id)} ist fast kaputt – bald im Laden eine neue kaufen!`);
  if (S.dura[id] <= 0) { delete S.dura[id]; useItem(id); snd('err'); const spare = cnt(id) > 0; if (spare) S.dura[id] = ITEM[id].dura; setTimeout(() => toast(spare ? `${itemName(id)} ist kaputtgegangen – du nimmst die Ersatz-${itemName(id)}.` : `${itemName(id)} ist kaputtgegangen! Im Laden gibt es Ersatz.`), 400); }
}
const duraCol = f => f > .5 ? '#7cc85a' : f > .2 ? '#ffb84d' : '#e0503a';
function duraBar(id, cls) { const f = duraOf(id) / ITEM[id].dura; return `<span class="${cls}"><i style="width:${Math.max(4, f * 100)}%;background:${duraCol(f)}"></i></span>`; }
const duraOf = id => (S.dura && S.dura[id] !== undefined) ? S.dura[id] : ITEM[id].dura;
const iconOf = id => id.replace('-', '_');
const SELLABLE = [...Object.keys(CROPS), 'berry', 'wood', 'milk'];
const sellOf = id => ITEM[id].sell || 0;
const priceOf = id => (S.prices && S.prices[id]) || sellOf(id);
const prStep = id => Math.max(1, Math.round(sellOf(id) / 10));
const appeal = id => Math.pow(sellOf(id) / priceOf(id), 2);
const priceTag = id => { const r = priceOf(id) / sellOf(id); return r <= .75 ? 'sehr schnell' : r < .95 ? 'schnell' : r <= 1.05 ? 'normal' : r <= 1.3 ? 'langsam' : 'sehr langsam'; };
const SEASONS = ['Frühling', 'Sommer', 'Herbst', 'Winter'];
const WDAYS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const SOLID = new Set(['T', 'H', 'S', 'B', 'U', 'W', 'L', 'X', 'Y', 'F', 'O', 'N', 'K']);
let LOC = 'farm', fadeT = 0;
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const DOOR = [4, 4];

/* ---------- map ---------- */
const MAP = [];
for (let y = 0; y < ROWS; y++) MAP.push(new Array(COLS).fill('G'));
const set = (x, y, c) => { if (x >= 0 && y >= 0 && x < COLS && y < ROWS) MAP[y][x] = c; };
for (let x = 0; x < COLS; x++) { set(x, 0, 'T'); set(x, ROWS - 1, 'T'); }
for (let y = 0; y < ROWS; y++) { set(0, y, 'T'); set(COLS - 1, y, 'T'); }
[[1,1],[22,1],[22,2],[1,13],[1,14],[2,14],[22,13],[21,14],[22,14],[12,14]].forEach(([x,y]) => set(x, y, 'T'));
for (let x = 2; x <= 6; x++) for (let y = 1; y <= 4; y++) set(x, y, 'H');
for (let x = 18; x <= 20; x++) for (let y = 2; y <= 3; y++) set(x, y, 'S');
set(8, 3, 'L'); set(8, 4, 'L'); set(9, 3, 'L'); set(9, 4, 'L');
set(4, 5, 'P'); for (let x = 4; x <= 19; x++) set(x, 6, 'P'); set(19, 5, 'P'); set(19, 4, 'P'); set(8, 5, 'P'); set(9, 5, 'P');
// Der Laden ist jetzt in der Innenstadt: Platz frei machen, Weg nach Osten bis zum Tor
for (let x = 18; x <= 20; x++) for (let y = 2; y <= 3; y++) set(x, y, 'G');
set(19, 3, 'B'); set(20, 3, 'B'); set(19, 4, 'B'); set(20, 4, 'B'); set(19, 5, 'P'); set(20, 5, 'P');
for (let x = 4; x <= 23; x++) set(x, 6, 'P');
// Lagerhaus neben dem Auftragsbrett (Kacheln 12–15 / 2–4), Weg zur Tür
for (let x = 12; x <= 15; x++) for (let y = 2; y <= 4; y++) set(x, y, 'K');
set(13, 5, 'P');
const STO = { x0: 184, y0: 32 };
const HELPER = 'Ben', BEN_MIN = 4, BEN_MAX = 16; // Hofhelfer: gießt, erntet und melkt tagsüber (6–18 Uhr), Stundenlohn
const benWage = () => S.benWage || 8, benPace = w => w < 6 ? 'gemütlich' : w < 10 ? 'normal' : w < 14 ? 'flink' : 'sehr flink';
const GATE = [23, 6];
// Land zum Dazukaufen: drei Stücke im Süden (Reihen 15–22), bis zum Kauf Wald
const LAND = [{ id: 'sw', name: 'Südwiese West', x0: 1, x1: 7, price: 1000 }, { id: 'sm', name: 'Südwiese Mitte', x0: 8, x1: 15, price: 1500 }, { id: 'so', name: 'Südwiese Ost', x0: 16, x1: 22, price: 2000 }];
const LAND_Y0 = 15, LAND_Y1 = 22;
let LANDOWN = [];
const landAt = (x, y) => y >= LAND_Y0 && y <= LAND_Y1 ? LAND.find(L => x >= L.x0 && x <= L.x1) : null;
const lockedAt = (x, y) => { const L = landAt(x, y); return !!L && !LANDOWN.includes(L.id); };
function applyLand(owned) {
  LANDOWN = owned || [];
  for (const L of LAND) for (let y = LAND_Y0; y <= LAND_Y1; y++) for (let x = L.x0; x <= L.x1; x++) {
    let wet = false; for (let py = 0; py < 16 && !wet; py += 2) for (let px = 0; px < 16 && !wet; px += 2) if (WET[(y * 16 + py) * W + x * 16 + px]) wet = true;

const STX = 304, STY = 48; // Verkaufsstand (Kacheln 19–20 / 3–4)
const BDX = 128, BDY = 48; // Auftragsbrett (Kacheln 8–9 / 3–4)
// Kuhweide direkt unter dem Hauptweg, Tor oben zum Weg
const PAST = { x0: 156, y0: 124, x1: 252, y1: 156, g0: 196, g1: 212 }, COW_MAX = 4, COW_PRICE = 500;
const inPast = (x, y) => x > PAST.x0 && x < PAST.x1 && y > PAST.y0 && y < PAST.y1;
function fenceAt(x, y) {
  const P = PAST, inX = x >= P.x0 - 3 && x <= P.x1 + 3, inY = y >= P.y0 - 2 && y <= P.y1 + 2;
  if (inX && Math.abs(y - P.y0) <= 2 && !(x > P.g0 && x < P.g1)) return true;
  if (inX && Math.abs(y - P.y1) <= 2) return true;
  return inY && (Math.abs(x - P.x0) <= 3 || Math.abs(x - P.x1) <= 3);
}
const isEdge = (x, y) => x <= 0 || y <= 0 || x >= COLS - 1 || y >= ROWS - 1 || lockedAt(x, y);
// Innenstadt: eigene Karte
const MAP_T = [];
for (let y = 0; y < TROWS; y++) MAP_T.push(new Array(COLS).fill('G'));
const setT = (x, y, c) => { if (x >= 0 && y >= 0 && x < COLS && y < TROWS) MAP_T[y][x] = c; };
for (let x = 0; x < COLS; x++) { setT(x, 0, 'T'); setT(x, TROWS - 1, 'T'); }
for (let y = 0; y < TROWS; y++) { setT(0, y, 'T'); setT(COLS - 1, y, 'T'); }

for (let x = 10; x <= 13; x++) for (let y = 10; y <= 13; y++) setT(x, y, 'P');

const TOWN_LAMPS = [[8, 6], [15, 6], [8, 10], [15, 10]];
TOWN_LAMPS.forEach(([x, y]) => setT(x, y, 'O'));
const TOWN_TREES = [[1, 1], [8, 2], [14, 2], [22, 1], [1, 11], [7, 14], [16, 14], [22, 10], [22, 13]];

function migrate(d) {
  if (d.bar) return migrate2(d);
  const items = { hoe: 1, can: 1, sickle: 1 };
  for (const t in CROPS) {
    if (d.seeds && d.seeds[t]) items['seed-' + t] = d.seeds[t];
    if (d.produce && d.produce[t]) items[t] = d.produce[t];
  }
  if (d.snacks) items.snack = d.snacks;
  d.items = items; d.bar = Array(BAR_N).fill(null); d.bag = Array(BAG_N).fill(null);
  ['hoe', 'can', 'sickle', 'seed-ruebe', 'seed-kohl', 'seed-kuerbis', 'snack'].filter(i => items[i]).forEach((id, i) => d.bar[i] = id);
  Object.keys(CROPS).filter(t => items[t]).forEach((t, i) => d.bag[i] = t);
  d.sel = 0; delete d.seeds; delete d.produce; delete d.snacks;
  return migrate2(d);
}
function migrate2(d) {
  if (!d.prices) d.prices = {};
  for (const id of ['axe', 'shovel']) if (!d.items[id]) {
    d.items[id] = 1;

function buy(id, n) {

  }

    const t = id.slice(5), pr = ITEM[t].price;

    if (!addItem(t, 1)) return;
    S.gold -= pr; if (!S.dura) S.dura = {}; if (!had) S.dura[t] = ITEM[t].dura; snd('coin'); $('dlg').innerHTML = shopHTML(); return;
  }

  if (S.gold < price * n) { snd('err'); return; }

  else if (id === 'can') { S.canCap = 40; S.water = 40; }

}
