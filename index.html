<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sonnenhof – Ein kleines Farmspiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(circle at 50% 30%,#35522a,#132010 75%);display:flex;align-items:center;justify-content:center;font-family:'Pixelify Sans',ui-monospace,monospace;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#wrap{position:relative;font-size:14px}
#c{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.55);cursor:pointer}
.panel{background:#f7d99c;border:.2em solid #6b3f1a;border-radius:.35em;box-shadow:inset 0 0 0 .14em #e2ae62,inset 0 0 0 .28em #fbe7bd,0 .2em 0 #3d220c;color:#4a2a10}
#clock{position:absolute;top:.6em;right:.6em;padding:.4em .7em;text-align:right;min-width:8.6em;line-height:1.2}
#date{font-weight:700}
#time{font-size:1.45em;font-weight:700;letter-spacing:.03em}
#weather{margin-right:.3em}
#gold{margin-top:.25em;display:flex;align-items:center;justify-content:flex-end;gap:.3em;font-weight:700;border-top:.12em dashed #c99353;padding-top:.25em}
#gold img{width:1.2em;height:1.2em;image-rendering:pixelated}
#energy{position:absolute;right:.6em;bottom:.6em;width:2.3em;height:9.5em;padding:.4em .4em .25em;display:flex;flex-direction:column;align-items:center;gap:.15em}
#ebar{flex:1;width:100%;background:#4a2a10;border-radius:.2em;position:relative;overflow:hidden}
#efill{position:absolute;left:0;right:0;bottom:0;background:#5fcf3a;transition:height .3s}
#elabel{font-weight:700;font-size:.9em}
#hotbar{position:absolute;left:50%;bottom:.6em;transform:translateX(-50%);display:flex;gap:.25em;padding:.3em}
.slot{width:2.9em;height:2.9em;background:#e9b96e;border:.14em solid #9c6127;border-radius:.25em;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.slot.sel{border-color:#d9301e;box-shadow:0 0 0 .14em #ffdf6b;transform:translateY(-.2em)}
.slot img{width:80%;height:80%;image-rendering:pixelated;pointer-events:none}
.slot .n{position:absolute;right:.15em;bottom:-.05em;font-weight:700;font-size:.85em;color:#fff;text-shadow:0 .08em 0 #3d220c,.08em 0 0 #3d220c,-.08em 0 0 #3d220c,0 -.08em 0 #3d220c;pointer-events:none}
.slot .k{position:absolute;left:.2em;top:0;font-size:.6em;color:#7a4a1e;pointer-events:none}
.slot .wl{position:absolute;left:.3em;right:.3em;bottom:.22em;height:.28em;background:#4a2a10;border-radius:.1em;overflow:hidden;pointer-events:none}
.slot .wl i{display:block;height:100%;background:#4fb3ff}
#basket{position:absolute;top:.6em;left:3.3em;padding:.3em .55em;display:flex;gap:.55em;align-items:center;font-weight:700}
#basket .lbl{font-size:.75em;opacity:.75}
#basket .it{display:flex;align-items:center;gap:.1em}
#basket img{width:1.55em;height:1.55em;image-rendering:pixelated}
#helpBtn{position:absolute;top:.6em;left:.6em;width:2.3em;height:2.3em;font:inherit;font-weight:700;cursor:pointer;padding:0}
#hint{position:absolute;left:50%;bottom:4.4em;transform:translateX(-50%);padding:.2em .6em;font-size:.85em;font-weight:600;white-space:nowrap;display:none}
#hint kbd{font-family:inherit;background:#6b3f1a;color:#fbe7bd;border-radius:.2em;padding:0 .3em;margin-right:.3em}
#toast{position:absolute;left:50%;bottom:6.4em;transform:translateX(-50%) translateY(.4em);padding:.35em .8em;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#shade{position:absolute;inset:0;background:rgba(25,12,0,.5);display:none;align-items:center;justify-content:center;border-radius:6px;z-index:5}
#dlg{width:min(92%,31em);max-height:92%;overflow:auto;padding:.9em 1.2em 1em}
#dlg h2{margin:0 0 .35em;font-size:1.35em}
#dlg p{margin:.35em 0;line-height:1.35}
#dlg .sub{opacity:.8;margin-top:0}
#dlg ul{margin:.3em 0;padding-left:1.2em;line-height:1.45}
#dlg kbd{font-family:inherit;background:#6b3f1a;color:#fbe7bd;border-radius:.2em;padding:0 .3em}
.btn{font:inherit;font-weight:700;background:#e9b96e;border:.14em solid #6b3f1a;border-radius:.25em;padding:.25em .75em;color:#4a2a10;cursor:pointer;box-shadow:0 .15em 0 #6b3f1a}
.btn:hover:not(:disabled){background:#f6cd8a}
.btn:active:not(:disabled){transform:translateY(.1em);box-shadow:0 .05em 0 #6b3f1a}
.btn:disabled{opacity:.4;cursor:default}
.btn.red{background:#e3876b}
.row{display:flex;align-items:center;gap:.55em;padding:.4em 0;border-bottom:.1em dashed #c99353}
.row img{width:2.1em;height:2.1em;image-rendering:pixelated}
.row .info{flex:1;display:flex;flex-direction:column;line-height:1.2}
.row small{opacity:.75}
.row .price{font-weight:700;min-width:3em;text-align:right}
.foot{display:flex;gap:.5em;justify-content:flex-end;margin-top:.7em;flex-wrap:wrap}
.sumline{display:flex;justify-content:space-between;padding:.15em 0}
.total{font-weight:700;border-top:.12em solid #c99353;margin-top:.3em;padding-top:.3em}
#fade{position:absolute;inset:0;background:#0b0704;opacity:0;pointer-events:none;transition:opacity .6s;border-radius:6px;z-index:4}
#touch{display:none}
@media (pointer:coarse){#touch{display:block}}
#dpad{position:absolute;left:.6em;bottom:.6em;display:grid;grid-template-columns:repeat(3,2.5em);grid-template-rows:repeat(3,2.5em);gap:.1em}
#dpad button,#abtn{font:inherit;font-weight:700;background:rgba(247,217,156,.85);border:.15em solid #6b3f1a;border-radius:.4em;color:#4a2a10;padding:0;touch-action:none}
#abtn{position:absolute;right:.6em;bottom:10.8em;width:3.2em;height:3.2em;border-radius:50%;font-size:1.1em}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="384" height="256"></canvas>
  <button id="helpBtn" class="panel" title="Hilfe & Steuerung">?</button>
  <div id="basket" class="panel"></div>
  <div id="clock" class="panel">
    <div id="date"></div>
    <div><span id="weather"></span><span id="time"></span></div>
    <div id="gold"></div>
  </div>
  <div id="energy" class="panel" title="Energie"><div id="ebar"><div id="efill"></div></div><div id="elabel">E</div></div>
  <div id="hotbar" class="panel"></div>
  <div id="hint" class="panel"></div>
  <div id="toast" class="panel"></div>
  <div id="touch">
    <div id="dpad">
      <button data-k="u" style="grid-area:1/2">▲</button>
      <button data-k="l" style="grid-area:2/1">◀</button>
      <button data-k="r" style="grid-area:2/3">▶</button>
      <button data-k="d" style="grid-area:3/2">▼</button>
    </div>
    <button id="abtn">A</button>
  </div>
  <div id="fade"></div>
  <div id="shade"><div id="dlg" class="panel"></div></div>
</div>

<script>
(() => {
'use strict';
const W = 384, H = 256, TS = 16, COLS = 24, ROWS = 16;
const C = document.getElementById('c'), X = C.getContext('2d');
X.imageSmoothingEnabled = false;
const $ = id => document.getElementById(id);

/* ---------- helpers ---------- */
function R(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function disc(g, cx, cy, r, c) {
  g.fillStyle = c;
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.round(Math.sqrt(Math.max(0, r * r - dy * dy)));
    g.fillRect(cx - w, cy + dy, w * 2 + 1, 1);

}
function hash(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 982451653)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }

/* ---------- game data ---------- */
const CROPS = {
  ruebe:   { name: 'Rübe',   seed: 'Rübensamen',  days: 4,  buy: 20,  sell: 35 },
  kohl:    { name: 'Kohl',   seed: 'Kohlsamen',   days: 7,  buy: 50,  sell: 120 },
  kuerbis: { name: 'Kürbis', seed: 'Kürbissamen', days: 10, buy: 100, sell: 260 },
};
const SLOTS = [
  { kind: 'hoe', name: 'Hacke', icon: 'hoe' },
  { kind: 'can', name: 'Gießkanne', icon: 'can' },
  { kind: 'seed', crop: 'ruebe', icon: 'seed_ruebe' },
  { kind: 'seed', crop: 'kohl', icon: 'seed_kohl' },
  { kind: 'seed', crop: 'kuerbis', icon: 'seed_kuerbis' },
  { kind: 'snack', name: 'Gartensalat', icon: 'snack' },
];
const SEASONS = ['Frühling', 'Sommer', 'Herbst', 'Winter'];
const WDAYS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const SOLID = new Set(['T', 'H', 'S', 'B', 'W', 'U']);
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const DOOR = [4, 4];

/* ---------- map ---------- */
const MAP = [];
for (let y = 0; y < ROWS; y++) MAP.push(new Array(COLS).fill('G'));
const set = (x, y, c) => { if (x >= 0 && y >= 0 && x < COLS && y < ROWS) MAP[y][x] = c; };
for (let x = 0; x < COLS; x++) { set(x, 0, 'T'); set(x, ROWS - 1, 'T'); }
for (let y = 0; y < ROWS; y++) { set(0, y, 'T'); set(COLS - 1, y, 'T'); }
[[1,1],[22,1],[22,2],[1,13],[1,14],[2,14],[22,13],[21,14],[22,14],[16,1],[12,14]].forEach(([x,y]) => set(x, y, 'T'));
for (let x = 2; x <= 6; x++) for (let y = 1; y <= 4; y++) set(x, y, 'H');
for (let x = 18; x <= 20; x++) for (let y = 2; y <= 3; y++) set(x, y, 'S');
set(8, 4, 'B');
for (let x = 17; x <= 21; x++) for (let y = 10; y <= 13; y++) set(x, y, 'W');
set(17, 10, 'G'); set(21, 10, 'G'); set(17, 13, 'G'); set(21, 13, 'G');
set(4, 5, 'P'); for (let x = 4; x <= 19; x++) set(x, 6, 'P'); set(19, 5, 'P'); set(19, 4, 'P'); set(8, 5, 'P');
[[11,2],[14,2],[22,6],[22,7],[1,8],[15,14]].forEach(([x,y]) => set(x, y, 'U'));
const tileAt = (x, y) => (x < 0 || y < 0 || x >= COLS || y >= ROWS) ? 'T' : MAP[y][x];

/* ---------- tile art ---------- */
function drawGrass(g, tx, ty) {
  const x0 = tx * 16, y0 = ty * 16;
  R(g, x0, y0, 16, 16, '#6cb14e');
  for (let i = 0; i < 14; i++) {
    const a = hash(tx, ty, i), b = hash(tx, ty, i + 50), c = hash(tx, ty, i + 100);
    const px = x0 + Math.floor(a * 16), py = y0 + Math.floor(b * 16);
    if (c < .45) R(g, px, py, 1, 1, '#5d9f43');
    else if (c < .75) R(g, px, py, 1, 1, '#82c765');
    else { R(g, px, py, 1, 2, '#4e8f38'); R(g, px + 1, py - 1, 1, 2, '#5d9f43'); }
  }
  if (MAP[ty][tx] === 'G' && hash(tx, ty, 999) < .09) {
    const px = x0 + 3 + Math.floor(hash(tx, ty, 7) * 9), py = y0 + 3 + Math.floor(hash(tx, ty, 8) * 9);
    const col = ['#fff6e0', '#ffd84a', '#f28fb1', '#a9c8ff'][Math.floor(hash(tx, ty, 9) * 4)];
    R(g, px - 1, py, 3, 1, col); R(g, px, py - 1, 1, 3, col); R(g, px, py, 1, 1, '#e8901c');
  }
}
function drawPath(g, tx, ty) {
  const x0 = tx * 16, y0 = ty * 16;
  R(g, x0, y0, 16, 16, '#d9b47b');
  for (let i = 0; i < 10; i++) {
    const px = x0 + Math.floor(hash(tx, ty, i) * 15), py = y0 + Math.floor(hash(tx, ty, i + 30) * 15);
    R(g, px, py, hash(tx, ty, i + 60) < .5 ? 2 : 1, 1, hash(tx, ty, i + 90) < .6 ? '#c39761' : '#ebcf9c');
  }
  const p = (x, y) => { const t = tileAt(x, y); return t === 'P' || t === 'H' || t === 'S' || t === 'B'; };
  if (!p(tx, ty - 1)) R(g, x0, y0, 16, 1, '#b99057');
  if (!p(tx, ty + 1)) R(g, x0, y0 + 15, 16, 1, '#b99057');
  if (!p(tx - 1, ty)) R(g, x0, y0, 1, 16, '#b99057');
  if (!p(tx + 1, ty)) R(g, x0 + 15, y0, 1, 16, '#b99057');
}
function drawTree(g, tx, ty) {
  const x0 = tx * 16, y0 = ty * 16, s = Math.floor(hash(tx, ty, 3) * 3) - 1;
  R(g, x0 + 3, y0 + 14, 10, 2, 'rgba(0,0,0,.22)');
  R(g, x0 + 6, y0 + 10, 4, 5, '#6b4226'); R(g, x0 + 6, y0 + 10, 1, 5, '#8a5a34');
  disc(g, x0 + 8 + s, y0 + 7, 7, '#2b6528');
  disc(g, x0 + 7 + s, y0 + 6, 6, '#3d8835');
  disc(g, x0 + 6 + s, y0 + 5, 3, '#55a346');
  R(g, x0 + 5 + s, y0 + 3, 2, 1, '#7cc25e'); R(g, x0 + 10 + s, y0 + 6, 1, 1, '#7cc25e'); R(g, x0 + 4 + s, y0 + 8, 1, 1, '#4c9a3e');
  if (hash(tx, ty, 11) < .3) { R(g, x0 + 9 + s, y0 + 4, 1, 1, '#e8473b'); R(g, x0 + 5 + s, y0 + 9, 1, 1, '#e8473b'); }
}
function drawBush(g, tx, ty) {
  const x0 = tx * 16, y0 = ty * 16;
  R(g, x0 + 2, y0 + 13, 12, 2, 'rgba(0,0,0,.2)');
  disc(g, x0 + 8, y0 + 9, 6, '#2f6e2b'); disc(g, x0 + 7, y0 + 8, 5, '#46923a');
  R(g, x0 + 5, y0 + 6, 2, 1, '#6fb956');
  R(g, x0 + 10, y0 + 8, 1, 1, '#4a6fe0'); R(g, x0 + 6, y0 + 10, 1, 1, '#4a6fe0'); R(g, x0 + 9, y0 + 11, 1, 1, '#4a6fe0');
}
function drawWater(g, tx, ty, t) {
  const x0 = tx * 16, y0 = ty * 16;
  const isW = (x, y) => tileAt(x, y) === 'W';
  R(g, x0, y0, 16, 16, '#3b8bd4');
  for (let i = 0; i < 3; i++) {
    const ph = (t * .7 + hash(tx, ty, i + 20) * 6) % 6;
    if (ph < 3) {
      const px = x0 + 3 + Math.floor(hash(tx, ty, i) * 9) + Math.floor(ph), py = y0 + 3 + Math.floor(hash(tx, ty, i + 5) * 10);
      R(g, px, py, 3, 1, '#8fd0ff');
    }
  }
  if (hash(tx, ty, 77) < .3) { disc(g, x0 + 8, y0 + 9, 3, '#4f9a3a'); R(g, x0 + 8, y0 + 7, 1, 3, '#3b8bd4'); R(g, x0 + 6, y0 + 8, 1, 1, '#79c25a'); }
  const sand = '#d8bf86', foam = '#d4f0ff';
  if (!isW(tx, ty - 1)) R(g, x0, y0 + 2, 16, 1, foam);
  if (!isW(tx, ty + 1)) R(g, x0, y0 + 13, 16, 1, foam);
  if (!isW(tx - 1, ty)) R(g, x0 + 2, y0, 1, 16, foam);
  if (!isW(tx + 1, ty)) R(g, x0 + 13, y0, 1, 16, foam);
  if (!isW(tx, ty - 1)) R(g, x0, y0, 16, 2, sand);
  if (!isW(tx, ty + 1)) R(g, x0, y0 + 14, 16, 2, sand);
  if (!isW(tx - 1, ty)) R(g, x0, y0, 2, 16, sand);
  if (!isW(tx + 1, ty)) R(g, x0 + 14, y0, 2, 16, sand);
}
const WINDOWS = [[42, 55, 12, 10], [90, 55, 12, 10]];
function drawHouse(g) {
  const x0 = 32, y0 = 16;
  R(g, x0 + 4, y0 + 62, 74, 3, 'rgba(0,0,0,.2)');
  R(g, x0 + 2, y0 + 30, 76, 34, '#c98a4b');
  for (let y = y0 + 33; y < y0 + 64; y += 4) R(g, x0 + 2, y, 76, 1, '#a86d36');
  R(g, x0 + 2, y0 + 30, 3, 34, '#7b4a22'); R(g, x0 + 75, y0 + 30, 3, 34, '#7b4a22');
  R(g, x0 + 2, y0 + 62, 76, 2, '#6b3f1a');
  for (let r = 0; r < 30; r++) {
    const ins = Math.max(0, 8 - r);
    R(g, x0 + ins, y0 + r, 80 - ins * 2, 1, r % 5 === 4 ? '#8e3022' : '#b5432f');
  }
  for (let row = 0; row < 6; row++)
    for (let xx = 4 + (row % 2) * 3; xx < 78; xx += 6) {
      const ins = Math.max(0, 8 - row * 5);
      if (xx > ins && xx < 80 - ins) R(g, x0 + xx, y0 + row * 5 + 1, 1, 3, '#9a3626');
    }
  R(g, x0 + 8, y0, 64, 1, '#d4614a');
  R(g, x0, y0 + 29, 80, 2, '#6e2418');
  R(g, x0 + 60, y0 - 3, 8, 9, '#8c8c8c'); R(g, x0 + 59, y0 - 4, 10, 2, '#6c6c6c');
  R(g, x0 + 60, y0, 8, 1, '#777'); R(g, x0 + 63, y0 - 2, 1, 2, '#777'); R(g, x0 + 61, y0 + 1, 1, 3, '#777');
  // door
  R(g, x0 + 33, y0 + 40, 14, 24, '#5a3416'); R(g, x0 + 35, y0 + 42, 10, 22, '#9c5f2c');
  R(g, x0 + 39, y0 + 42, 1, 22, '#7b4a22'); R(g, x0 + 35, y0 + 50, 10, 1, '#7b4a22'); R(g, x0 + 43, y0 + 53, 1, 2, '#f0c040');
  R(g, x0 + 31, y0 + 37, 18, 3, '#7b4a22');
  // windows
  for (const wx of [x0 + 9, x0 + 57]) {
    R(g, wx, y0 + 38, 14, 12, '#5a3416'); R(g, wx + 1, y0 + 39, 12, 10, '#9fd6f0');
    R(g, wx + 6, y0 + 39, 2, 10, '#5a3416'); R(g, wx + 1, y0 + 43, 12, 1, '#5a3416'); R(g, wx + 2, y0 + 40, 2, 2, '#e6f7ff');
    R(g, wx - 1, y0 + 50, 16, 3, '#7b4a22'); R(g, wx - 1, y0 + 50, 16, 1, '#9c6127');
    R(g, wx, y0 + 49, 14, 1, '#4f9a3a');
    R(g, wx + 1, y0 + 48, 2, 2, '#e84a5f'); R(g, wx + 6, y0 + 48, 2, 2, '#ffd84a'); R(g, wx + 11, y0 + 48, 2, 2, '#e84a5f');
  }
}
function drawShop(g) {
  const x0 = 288, y0 = 32;
  R(g, x0 + 2, y0 + 30, 46, 3, 'rgba(0,0,0,.2)');
  R(g, x0 + 2, y0 + 6, 44, 16, '#8a5a2b');
  R(g, x0 + 2, y0 + 13, 44, 1, '#5a3416');
  const bags = ['#e9d9a6', '#6fbf4a', '#e8862a', '#c94a5a', '#e9d9a6', '#6fbf4a'];
  bags.forEach((c, i) => { R(g, x0 + 6 + i * 6, y0 + 8, 4, 5, '#d9b27a'); R(g, x0 + 7 + i * 6, y0 + 10, 2, 2, c); });
  R(g, x0 + 8, y0 + 15, 30, 4, '#6b4422'); R(g, x0 + 10, y0 + 16, 3, 2, '#e8862a'); R(g, x0 + 16, y0 + 16, 3, 2, '#6fbf4a'); R(g, x0 + 30, y0 + 16, 3, 2, '#f1e4bb');
  R(g, x0 + 2, y0, 3, 32, '#6b3f1a'); R(g, x0 + 43, y0, 3, 32, '#6b3f1a');
  for (let i = 0; i < 8; i++) {
    const c = i % 2 ? '#f3e6c8' : '#c8413a';
    R(g, x0 + i * 6, y0 - 2, 6, 10, c); R(g, x0 + i * 6 + 1, y0 + 8, 4, 1, c); R(g, x0 + i * 6 + 2, y0 + 9, 2, 1, c);
  }
  R(g, x0, y0 - 3, 48, 1, '#7b2a22'); R(g, x0, y0 + 1, 48, 1, 'rgba(0,0,0,.08)');
  R(g, x0, y0 + 20, 48, 12, '#a0662f'); R(g, x0, y0 + 20, 48, 2, '#d39a5a');
  for (let k = 8; k < 48; k += 8) R(g, x0 + k, y0 + 22, 1, 10, '#7b4a22');
  // crates on counter
  R(g, x0 + 5, y0 + 15, 11, 6, '#7b4a22'); [[7,15],[10,14],[13,15]].forEach(([a,b]) => R(g, x0 + a, y0 + b, 2, 2, '#e07b24'));
  R(g, x0 + 32, y0 + 15, 11, 6, '#7b4a22'); [[34,15],[37,14],[40,15]].forEach(([a,b]) => R(g, x0 + a, y0 + b, 2, 2, '#8fd16a'));
}
function drawBin(g) {
  const x0 = 128, y0 = 64;

  if (t === 'S') { openDlg(shopHTML()); return; }
  if (t === 'B') {
    let n = 0; for (const c in S.produce) { n += S.produce[c]; S.shipped[c] += S.produce[c]; S.produce[c] = 0; }
    if (!n) { toast('Leg hier deine Ernte rein – sie wird über Nacht verkauft.'); return; }
    snd('ship'); toast(`${n} Stück in die Versandkiste gelegt`); return;
  }
  if (tool.kind === 'hoe') {
    actTool = 'hoe';
    if (t !== 'G') { toast('Hier kann man nicht hacken.'); snd('err'); return; }
    if (s) { if (s.c) toast('Hier wächst schon etwas.'); return; }
    if (!needEnergy(2)) return;
    S.soil[k] = { w: S.rain, c: null }; burst(tx, ty, ['#7a4d2c', '#93613a', '#5e3b22'], 8); snd('till');
  } else if (tool.kind === 'can') {
    actTool = 'can';
    if (t === 'W') { S.water = S.canCap; burst(tx, ty, ['#8fd0ff', '#d4f0ff'], 8, 60); snd('water'); toast('Gießkanne aufgefüllt'); return; }
    if (!s) { toast('Gieß den aufgelockerten Boden.'); return; }
    if (S.water <= 0) { toast('Die Gießkanne ist leer – füll sie am Teich auf.'); snd('err'); return; }
    if (!needEnergy(1)) return;
    S.water--; s.w = true; burst(tx, ty, ['#4fb3ff', '#8fd0ff'], 8, 30); snd('water');
  } else if (tool.kind === 'seed') {
    const c = CROPS[tool.crop];
    if (!s) { toast('Erst den Boden mit der Hacke auflockern.'); snd('err'); return; }
    if (s.c) { toast('Hier wächst schon etwas.'); return; }
    if (!S.seeds[tool.crop]) { toast(`Keine ${c.seed} mehr – im Laden gibt's neue.`); snd('err'); return; }
    S.seeds[tool.crop]--; s.c = { t: tool.crop, d: 0 }; snd('plant'); burst(tx, ty, ['#3e2613', '#6cc04f'], 4, 20);
  } else if (tool.kind === 'snack') {
    if (!S.snacks) { toast('Kein Salat mehr. Im Laden gibt es welchen.'); snd('err'); return; }
    if (S.energy >= S.maxEnergy) { toast('Du bist gerade nicht hungrig.'); return; }
    S.snacks--; S.energy = Math.min(S.maxEnergy, S.energy + 40); snd('eat'); toast('Mmh, knackig! +40 Energie');
  }
}

/* ---------- day cycle ---------- */
let fading = false;
function endDay(passedOut) {
  if (fading) return;
  fading = true; paused = true; $('fade').style.opacity = 1;
  setTimeout(() => {
    let income = 0, lines = '';
    for (const t in CROPS) {
      const n = S.shipped[t]; if (!n) continue;
      income += n * CROPS[t].sell;
      lines += `<div class="sumline"><span>${n}× ${CROPS[t].name}</span><span>${(n * CROPS[t].sell).toLocaleString('de-DE')}g</span></div>`;
      S.shipped[t] = 0;
    }
    S.gold += income; S.earned += income;
    let lost = 0;
    if (passedOut) { lost = Math.min(Math.floor(S.gold * .1), 500); S.gold -= lost; }
    let grown = 0;
    for (const k in S.soil) {
      const s = S.soil[k];
      if (s.c) { if (s.w && s.c.d < CROPS[s.c.t].days) { s.c.d++; grown++; } }
      else if (!s.w && Math.random() < .2) { delete S.soil[k]; continue; }
      s.w = false;
    }
    S.day++; S.rain = Math.random() < .22;
    if (S.rain) for (const k in S.soil) S.soil[k].w = true;
    S.energy = passedOut ? Math.round(S.maxEnergy * .6) : S.maxEnergy;
    S.time = 360; S.warned = false; S.px = 72; S.py = 93; S.dir = 'down';
    save();
    const ready = Object.values(S.soil).filter(s => s.c && s.c.d >= CROPS[s.c.t].days).length;
    let html = `<h2>${passedOut ? 'Du bist vor Erschöpfung umgekippt …' : 'Ein neuer Morgen'}</h2>`;
    if (passedOut) html += `<p>Ein Nachbar hat dich nach Hause gebracht. Für die Hilfe fehlen dir <b>${lost}g</b>, und du bist nicht ganz ausgeruht.</p>`;
    html += lines ? `<p><b>Verkauft:</b></p>${lines}<div class="sumline total"><span>Einnahmen</span><span>${income.toLocaleString('de-DE')}g</span></div>` : '<p>Gestern wurde nichts verkauft.</p>';
    if (grown) html += `<p>🌱 ${grown} Pflanze${grown > 1 ? 'n sind' : ' ist'} über Nacht gewachsen.</p>`;
    if (ready) html += `<p>✨ ${ready} Pflanze${ready > 1 ? 'n sind' : ' ist'} erntereif!</p>`;
    if (S.rain) html += '<p>🌧️ Heute regnet es – deine Felder sind schon gegossen.</p>';
    html += `<div class="foot"><button class="btn" data-act="close">Tag ${S.day} beginnen</button></div>`;
    openDlg(html);
    $('fade').style.opacity = 0; fading = false;
  }, 700);
}

/* ---------- input ---------- */
const keys = new Set();
const KMAP = { ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r', ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'd', s: 'd', S: 'd' };
const coarse = matchMedia('(pointer:coarse)').matches;
addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (paused && !fading) closeDlg(); return; }
  if (KMAP[e.key]) { keys.add(KMAP[e.key]); e.preventDefault(); return; }
  if (paused) return;
  if (e.key === ' ' || e.key === 'e' || e.key === 'E' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) act(...targetTile()); return; }
  if (/^[1-6]$/.test(e.key)) selectSlot(+e.key - 1);
});
addEventListener('keyup', e => { if (KMAP[e.key]) keys.delete(KMAP[e.key]); });
addEventListener('blur', () => keys.clear());
C.addEventListener('wheel', e => { e.preventDefault(); if (!paused) selectSlot(S.sel + (e.deltaY > 0 ? 1 : -1)); }, { passive: false });
let mouseTile = null;
function evTile(e) { const r = C.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / r.width * W / 16), Math.floor((e.clientY - r.top) / r.height * H / 16)]; }
function inReach(tx, ty) { const [px, py] = playerTile(); return Math.abs(tx - px) <= 1 && Math.abs(ty - py) <= 1 && !(tx === px && ty === py); }
C.addEventListener('mousemove', e => { mouseTile = evTile(e); });
C.addEventListener('mouseleave', () => { mouseTile = null; });
C.addEventListener('click', e => {
  if (paused) return;
  const [tx, ty] = evTile(e);
  if (!inReach(tx, ty)) return;
  const [px, py] = playerTile(), dx = tx - px, dy = ty - py;
  S.dir = Math.abs(dx) >= Math.abs(dy) && dx ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  act(tx, ty);
});
$('helpBtn').addEventListener('click', () => { if (!fading) openDlg(helpHTML(false)); });
document.querySelectorAll('#dpad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); keys.add(k); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => keys.delete(k)));
});
$('abtn').addEventListener('pointerdown', e => { e.preventDefault(); act(...targetTile()); });

/* ---------- update ---------- */
let animT = 0, moving = false;
function blocked(x, y) { return SOLID.has(tileAt(Math.floor(x / 16), Math.floor(y / 16))); }
function tryMove(dx, dy) {
  const nx = S.px + dx, ny = S.py + dy;
  if (blocked(nx - 5, ny - 5) || blocked(nx + 5, ny - 5) || blocked(nx - 5, ny - 1) || blocked(nx + 5, ny - 1)) return;
  S.px = nx; S.py = ny;
}
const rain = Array.from({ length: 80 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: 180 + Math.random() * 80 }));
function update(dt) {
  if (actT > 0) actT -= dt;
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; p.vy += 160 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  if (S.rain) for (const d of rain) { d.y += d.s * dt; d.x -= d.s * .25 * dt; if (d.y > H) { d.y = -4; d.x = Math.random() * (W + 60); } }
  if (paused) { moving = false; return; }
  let dx = 0, dy = 0;
  if (keys.has('l')) dx--; if (keys.has('r')) dx++; if (keys.has('u')) dy--; if (keys.has('d')) dy++;
  moving = !!(dx || dy);
  if (moving) {
    if (dx) S.dir = dx > 0 ? 'right' : 'left'; else S.dir = dy > 0 ? 'down' : 'up';
    const len = Math.hypot(dx, dy), sp = 64 * dt;
    tryMove(dx / len * sp, 0); tryMove(0, dy / len * sp);
    animT += dt;
  } else animT = 0;
  S.time += dt * 2;
  if (S.time >= 1440 && !S.warned) { S.warned = true; toast('Mitternacht! Du solltest ins Bett gehen.'); }
  if (S.time >= 1560) { toast('Dir fallen die Augen zu …'); endDay(true); }
}

/* ---------- render ---------- */
function corners(x, y) {
  const c = 'rgba(255,255,255,.9)';
  R(X, x, y, 4, 1, c); R(X, x, y, 1, 4, c); R(X, x + 12, y, 4, 1, c); R(X, x + 15, y, 1, 4, c);
  R(X, x, y + 15, 4, 1, c); R(X, x, y + 12, 1, 4, c); R(X, x + 12, y + 15, 4, 1, c); R(X, x + 15, y + 12, 1, 4, c);
}
function render(t) {
  X.drawImage(BG, 0, 0);
  for (const [x, y] of WATER) drawWater(X, x, y, t);
  const has = (x, y) => !!S.soil[x + ',' + y];
  for (const k in S.soil) {
    const s = S.soil[k], [tx, ty] = k.split(',').map(Number), x0 = tx * 16, y0 = ty * 16;
    const base = s.w ? '#5e3b22' : '#93613a', line = s.w ? '#48291a' : '#7a4d2c', hi = s.w ? '#6e4729' : '#a87245';
    R(X, x0, y0, 16, 16, base);
    for (const yy of [3, 8, 13]) { R(X, x0 + 1, y0 + yy, 14, 1, line); R(X, x0 + 1, y0 + yy + 1, 14, 1, hi); }
    if (!has(tx, ty - 1)) R(X, x0, y0, 16, 1, line);
    if (!has(tx, ty + 1)) R(X, x0, y0 + 15, 16, 1, '#5a3a20');
    if (!has(tx - 1, ty)) R(X, x0, y0, 1, 16, line);
    if (!has(tx + 1, ty)) R(X, x0 + 15, y0, 1, 16, line);
  }
  for (const k in S.soil) {
    const s = S.soil[k]; if (!s.c) continue;
    const [tx, ty] = k.split(',').map(Number), v = cropStage(s.c);
    drawCrop(X, s.c.t, v, tx * 16, ty * 16);
    if (v === 4 && Math.floor(t * 2.5 + hash(tx, ty, 5) * 3) % 4 === 0) { R(X, tx * 16 + 13, ty * 16 + 2, 1, 3, '#fff'); R(X, tx * 16 + 12, ty * 16 + 3, 3, 1, '#fff'); }
  }
  if (!paused) {
    let ct = targetTile();
    if (mouseTile && inReach(...mouseTile)) ct = mouseTile;
    corners(ct[0] * 16, ct[1] * 16);
  }
  // player
  const f = moving ? Math.floor(animT * 8) % 4 : 0;
  const flip = S.dir === 'left';
  drawPlayerSprite(pg, flip ? 'right' : S.dir, f);
  const ox = Math.round(S.px - 8), oy = Math.round(S.py - 19) - (moving && f % 2 ? 1 : 0);
  R(X, Math.round(S.px) - 5, Math.round(S.py) - 2, 10, 2, 'rgba(0,0,0,.25)');
  if (flip) { X.save(); X.translate(ox + 16, oy); X.scale(-1, 1); X.drawImage(PC, 0, 0); X.restore(); }
  else X.drawImage(PC, ox, oy);
  // tool swing
  if (actT > 0 && actTool) {
    const d = DIRS[S.dir], lift = actT > .14 ? -5 : 0;
    const ix = Math.round(S.px - 8 + d[0] * 9), iy = Math.round(S.py - 16 + d[1] * 6 + lift);
    if (S.dir === 'left') { X.save(); X.translate(ix + 16, iy); X.scale(-1, 1); X.drawImage(ICON[actTool], 0, 0); X.restore(); }
    else X.drawImage(ICON[actTool], ix, iy);
  }
  for (const p of parts) R(X, Math.round(p.x), Math.round(p.y), 2, 2, p.col);
  // light
  const tm = S.time;
  let dark = 0;
  if (tm > 1080) dark = Math.min(.55, (tm - 1080) / 240 * .55);
  if (tm > 1000 && tm < 1200) { X.fillStyle = `rgba(255,140,40,${.12 * Math.sin((tm - 1000) / 200 * Math.PI)})`; X.fillRect(0, 0, W, H); }
  if (S.rain) {
    X.fillStyle = 'rgba(40,60,90,.22)'; X.fillRect(0, 0, W, H);
    X.fillStyle = 'rgba(190,215,255,.55)';
    for (const d of rain) { X.fillRect(Math.round(d.x), Math.round(d.y), 1, 4); }
  }
  if (dark > 0) {
    X.fillStyle = `rgba(16,20,64,${dark})`; X.fillRect(0, 0, W, H);
    for (const [x, y, w, h] of WINDOWS) {
      X.fillStyle = `rgba(255,200,90,${Math.min(1, dark * 2)})`; X.fillRect(x, y, w, h);
      X.fillStyle = `rgba(255,190,80,${dark * .35})`; X.fillRect(x - 3, y + h, w + 6, 6);
    }
  }
}

/* ---------- layout & loop ---------- */
function fit() {
  let s = Math.min(innerWidth / W, innerHeight / H) * .97;
  if (s >= 2) s = Math.floor(s);
  const w = $('wrap');
  w.style.width = W * s + 'px'; w.style.height = H * s + 'px';
  w.style.fontSize = Math.max(9, Math.min(18, s * 4.6)) + 'px';
}
addEventListener('resize', fit); fit();
buildHotbar();
if (firstRun) openDlg(helpHTML(true));
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render(now / 1000); updateHUD();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
