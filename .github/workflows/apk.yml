# Baut bei jedem Hochladen automatisch die Android-App (APK) für Sonnenhof.
# Die fertige APK liegt danach unter "Releases" → "Sonnenhof APK".
name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android-Projekt anlegen
        run: |
          set -e
          A=android/app/src/main
          mkdir -p $A/assets $A/java/de/sonnenhof/spiel $A/res/mipmap-xxhdpi
          cp index.html $A/assets/index.html
          echo "" | base64 -d > $A/res/mipmap-xxhdpi/ic_launcher.png
          echo "" | base64 -d > android/sonnenhof.jks

          cat > android/settings.gradle <<'G'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Sonnenhof"
          include ':app'
          G

          cat > android/build.gradle <<'G'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          G

          cat > android/gradle.properties <<'G'
          org.gradle.jvmargs=-Xmx2g
          G

          cat > android/app/build.gradle <<'G'
          plugins { id 'com.android.application' }
          android {
            namespace 'de.sonnenhof.spiel'
            compileSdk 34
            defaultConfig {
              applicationId 'de.sonnenhof.spiel'
              minSdk 24
              targetSdk 34
              versionCode Integer.parseInt(project.findProperty('vCode') ?: '1')
              versionName '1.' + (project.findProperty('vCode') ?: '1')
            }
            signingConfigs {
              fest {
                storeFile rootProject.file('sonnenhof.jks')
                storePassword 'sonnenhof'
                keyAlias 'sonnenhof'
                keyPassword 'sonnenhof'
              }
            }
            buildTypes { release { minifyEnabled false; signingConfig signingConfigs.fest } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          G

          cat > $A/AndroidManifest.xml <<'G'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Sonnenhof" android:icon="@mipmap/ic_launcher" android:isGame="true"
                android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:exported="true"
                  android:configChanges="orientation|screenSize|screenLayout|keyboard|keyboardHidden|navigation|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          G

          cat > $A/java/de/sonnenhof/spiel/MainActivity.java <<'G'
          package de.sonnenhof.spiel;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.InputDevice;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView web;
            private boolean hl, hr, hu, hd;

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              web = new WebView(this);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setUserAgentString(s.getUserAgentString() + " SonnenhofApp");
              web.setWebViewClient(new WebViewClient());
              setContentView(web);
              hideBars();
              web.loadUrl("file:///android_asset/index.html");
            }

            private void hideBars() {
              getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
            }

            @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) hideBars(); }
            @Override protected void onPause() { web.onPause(); super.onPause(); }
            @Override protected void onResume() { super.onResume(); web.onResume(); }

            private void key(String k, boolean down) {
              web.evaluateJavascript("window.dispatchEvent(new KeyboardEvent('" + (down ? "keydown" : "keyup") + "',{key:'" + k + "'}))", null);
            }

            @Override public void onBackPressed() { key("Escape", true); }

            @Override public boolean dispatchKeyEvent(KeyEvent e) {
              String k = null;
              switch (e.getKeyCode()) {
                case KeyEvent.KEYCODE_DPAD_UP: k = "ArrowUp"; break;
                case KeyEvent.KEYCODE_DPAD_DOWN: k = "ArrowDown"; break;
                case KeyEvent.KEYCODE_DPAD_LEFT: k = "ArrowLeft"; break;
                case KeyEvent.KEYCODE_DPAD_RIGHT: k = "ArrowRight"; break;
                case KeyEvent.KEYCODE_BUTTON_A: case KeyEvent.KEYCODE_DPAD_CENTER: k = " "; break;
                case KeyEvent.KEYCODE_BUTTON_B: k = "Escape"; break;
                case KeyEvent.KEYCODE_BUTTON_X: case KeyEvent.KEYCODE_BUTTON_Y: case KeyEvent.KEYCODE_BUTTON_SELECT: k = "i"; break;
                case KeyEvent.KEYCODE_BUTTON_L1: case KeyEvent.KEYCODE_BUTTON_L2: k = "PageUp"; break;
                case KeyEvent.KEYCODE_BUTTON_R1: case KeyEvent.KEYCODE_BUTTON_R2: k = "PageDown"; break;
                case KeyEvent.KEYCODE_BUTTON_START: k = "F1"; break;
              }
              if (k == null) return super.dispatchKeyEvent(e);
              boolean dir = k.startsWith("Arrow");
              if (e.getAction() == KeyEvent.ACTION_DOWN && e.getRepeatCount() == 0) key(k, true);
              else if (e.getAction() == KeyEvent.ACTION_UP && dir) key(k, false);
              return true;
            }

            private void stick(boolean want, boolean have, String k) { if (want != have) key(k, want); }

            @Override public boolean dispatchGenericMotionEvent(MotionEvent e) {
              if ((e.getSource() & InputDevice.SOURCE_JOYSTICK) != InputDevice.SOURCE_JOYSTICK) return super.dispatchGenericMotionEvent(e);
              float x = e.getAxisValue(MotionEvent.AXIS_X), y = e.getAxisValue(MotionEvent.AXIS_Y);
              float hx = e.getAxisValue(MotionEvent.AXIS_HAT_X), hy = e.getAxisValue(MotionEvent.AXIS_HAT_Y);
              if (Math.abs(hx) > Math.abs(x)) x = hx;
              if (Math.abs(hy) > Math.abs(y)) y = hy;
              boolean l = x < -0.45f, r = x > 0.45f, u = y < -0.45f, d = y > 0.45f;
              stick(l, hl, "ArrowLeft"); stick(r, hr, "ArrowRight"); stick(u, hu, "ArrowUp"); stick(d, hd, "ArrowDown");
              hl = l; hr = r; hu = u; hd = d;
              return true;
            }
          }
          G

      - name: APK bauen
        run: gradle -p android assembleRelease -PvCode=${{ github.run_number }}

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk Sonnenhof.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sonnenhof-APK
          path: Sonnenhof.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Sonnenhof APK
          body: "Automatisch gebaut aus dem neuesten Stand (Build ${{ github.run_number }}). Sonnenhof.apk herunterladen und auf dem Gerät installieren."
          files: Sonnenhof.apk
          make_latest: true
