<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Farm-Planer Sonnenhof</title>
<style>
:root{--rosa:#e47fa8;--rosaD:#c9628f;--hell:#fff6f9;--braun:#5c3626;--rand:#f1c6d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fbe9f0;color:var(--braun);font:15px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100dvh}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--hell);border-bottom:2px solid var(--rand)}
h1{font-size:16px;margin:0 8px 0 2px;white-space:nowrap}
button{font:inherit;color:var(--braun);background:#fff;border:2px solid var(--rand);border-radius:10px;padding:6px 10px;min-height:38px;cursor:pointer}
button:active{transform:translateY(1px)}
button.on{background:var(--rosa);border-color:var(--rosaD);color:#fff}
.sp{flex:1}
#opts{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:6px 10px;background:#fff;border-bottom:2px solid var(--rand);font-size:14px}
#opts[hidden]{display:none}
#opts label{display:flex;align-items:center;gap:4px}
#kinds{display:flex;flex-wrap:wrap;gap:4px}
#opts .kind{display:flex;align-items:center;gap:3px;border:2px solid var(--rand);border-radius:9px;padding:2px 6px;background:#fff}
#opts .kind canvas{width:16px;height:20px;image-rendering:pixelated}
#opts .hint{color:#9a6a7a;font-size:12px}
#wrap{flex:1;overflow:auto;position:relative;background:#26121f;touch-action:none}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;margin:12px}
#tools{background:var(--hell);border-top:2px solid var(--rand);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;overflow-x:auto}
.grp{display:flex;gap:6px;padding-right:8px;border-right:2px dashed var(--rand)}
.grp:last-child{border-right:0}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;padding:5px 4px;font-size:11px;line-height:1.1;text-align:center}
.tool canvas{width:32px;height:32px;image-rendering:pixelated}
.tool.on{background:#ffe1ec;border-color:var(--rosa);color:var(--braun)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--braun);color:#fff;padding:8px 14px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:.95}
dialog{border:3px solid var(--rosa);border-radius:16px;max-width:min(640px,92vw);color:var(--braun);background:var(--hell)}
dialog textarea{width:100%;height:240px;font:12px/1.2 ui-monospace,Menlo,monospace;border:2px solid var(--rand);border-radius:8px;padding:6px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
input,select,textarea{font-size:16px}
</style>
</head>
<body>
<header>
  <h1>🌸 Farm-Planer</h1>
  <button id="undo" title="Rückgängig">↶</button>
  <button id="redo" title="Wiederholen">↷</button>
  <button id="zo">−</button><button id="zi">+</button>
  <button id="pan">✋ Verschieben</button>
  <button id="grid" class="on">Raster</button>
  <button id="land" class="on">Kaufland</button>
  <span class="sp"></span>
  <button id="reset">Original</button>
  <button id="imp">Einfügen</button>
  <button id="copy" class="on">Kopieren</button>
</header>
<div id="opts" hidden><b>Zufällig verteilen:</b>
  <label>Dichte <input id="dens" type="range" min="5" max="80" value="30"> <span id="densv">30 %</span></label>
  <span id="kinds"></span>
  <span class="hint">Zieh ein Rechteck über die Fläche. Aus den freien Wiesenfeldern darin werden zufällig welche bepflanzt.</span>
</div>
<div id="wrap"><canvas id="cv" width="384" height="608"></canvas></div>
<div id="tools"></div>
<div id="toast"></div>
<dialog id="dlg"><b id="dt"></b><p id="dp" style="margin:6px 0 8px"></p><textarea id="ta" spellcheck="false"></textarea><div class="row"><button id="dno">Schließen</button><button id="dok" class="on">OK</button></div></dialog>
