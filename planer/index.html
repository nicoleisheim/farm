<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Farm-Planer Sonnenhof</title>
<style>
:root{--rosa:#e47fa8;--rosaD:#c9628f;--hell:#fff6f9;--braun:#5c3626;--rand:#f1c6d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fbe9f0;color:var(--braun);font:15px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100dvh}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--hell);border-bottom:2px solid var(--rand)}
h1{font-size:16px;margin:0 8px 0 2px;white-space:nowrap}
button{font:inherit;color:var(--braun);background:#fff;border:2px solid var(--rand);border-radius:10px;padding:6px 10px;min-height:38px;cursor:pointer}
button:active{transform:translateY(1px)}
button.on{background:var(--rosa);border-color:var(--rosaD);color:#fff}
.sp{flex:1}
#wrap{flex:1;overflow:auto;position:relative;background:#26121f;touch-action:none}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;margin:12px}
#tools{background:var(--hell);border-top:2px solid var(--rand);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;overflow-x:auto}
.grp{display:flex;gap:6px;padding-right:8px;border-right:2px dashed var(--rand)}
.grp:last-child{border-right:0}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;padding:5px 4px;font-size:11px;line-height:1.1;text-align:center}
.tool canvas{width:32px;height:32px;image-rendering:pixelated}
.tool.on{background:#ffe1ec;border-color:var(--rosa);color:var(--braun)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--braun);color:#fff;padding:8px 14px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:.95}
dialog{border:3px solid var(--rosa);border-radius:16px;max-width:min(640px,92vw);color:var(--braun);background:var(--hell)}
dialog textarea{width:100%;height:240px;font:12px/1.2 ui-monospace,Menlo,monospace;border:2px solid var(--rand);border-radius:8px;padding:6px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
input,select,textarea{font-size:16px}
</style>
</head>
<body>
<header>
  <h1>🌸 Farm-Planer</h1>
  <button id="undo" title="Rückgängig">↶</button>
  <button id="redo" title="Wiederholen">↷</button>
  <button id="zo">−</button><button id="zi">+</button>
  <button id="pan">✋ Verschieben</button>
  <button id="grid" class="on">Raster</button>
  <button id="land" class="on">Kaufland</button>
  <span class="sp"></span>
  <button id="reset">Original</button>
  <button id="imp">Einfügen</button>
  <button id="copy" class="on">Kopieren</button>
</header>
<div id="wrap"><canvas id="cv" width="384" height="608"></canvas></div>
<div id="tools"></div>
<div id="toast"></div>
<dialog id="dlg"><b id="dt"></b><p id="dp" style="margin:6px 0 8px"></p><textarea id="ta" spellcheck="false"></textarea><div class="row"><button id="dno">Schließen</button><button id="dok" class="on">OK</button></div></dialog>

  const s = Math.floor(hash(x, y - OFF, 3) * 3) - 1, tall = o === 'A' || o === 'C';
  R(g, x0 + 3, y0 + 14, 10, 2, 'rgba(60,20,40,.18)');
  spr(g, SPR[o], x0 + s, y0 - (tall ? 5 : 1));
}
let showGrid = true, showLand = true;
const base = mkc(W, H), bg = base.getContext('2d');
let dirtyBase = true;
function draw() {
  if (dirtyBase) {
    bg.clearRect(0, 0, W, H);
    bg.fillStyle = bg.createPattern(GRASS, 'repeat'); bg.fillRect(0, 0, W, H);
    drawPaths(bg); bg.save(); bg.translate(0, OFF * 16); drawPond(bg); bg.restore(); dirtyBase = false;
  }
  X.clearRect(0, 0, W, H); X.drawImage(base, 0, 0);
  // Blumen liegen wie im Spiel unter den Gebäuden, Zäune, Sträucher und Bäume davor
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if ('1234'.includes(st.obj[y][x])) drawObj(X, x, y);
  if (BLD.complete) X.drawImage(BLD, 0, OFF * 16);
  for (let y = 0; y < ROWS; y++) { for (let x = 0; x < COLS; x++) if (isFence(st.obj[y][x])) drawObj(X, x, y); for (let x = 0; x < COLS; x++) if ('AaCcU'.includes(st.obj[y][x])) drawObj(X, x, y); }
  if (showLand) { X.setLineDash([3, 2]); X.lineWidth = 1; X.strokeStyle = 'rgba(255,255,255,.9)';
    for (const L of DATA.land) X.strokeRect(L.x0 * 16 + .5, (DATA.landY[0] + OFF) * 16 + .5, (L.x1 - L.x0 + 1) * 16 - 1, (DATA.landY[1] - DATA.landY[0] + 1) * 16 - 1);
    X.setLineDash([]); X.fillStyle = 'rgba(255,255,255,.9)'; X.font = '7px sans-serif';
    for (const L of DATA.land) X.fillText('Kaufland', L.x0 * 16 + 3, (DATA.landY[0] + OFF) * 16 + 9);
  }
  if (showGrid) { X.fillStyle = 'rgba(0,0,0,.12)'; for (let i = 1; i < COLS; i++) X.fillRect(i * 16, 0, 1, H); for (let i = 1; i < ROWS; i++) X.fillRect(0, i * 16, W, 1);
    X.fillStyle = 'rgba(255,255,255,.75)'; for (let x = 0; x < W; x += 6) { X.fillRect(x, OFF * 16, 3, 1); X.fillRect(x, (OFF + 24) * 16 - 1, 3, 1); }
    X.font = '7px sans-serif'; X.fillText('Rand der Karte', 3, OFF * 16 - 3); X.fillText('Rand der Karte', 3, (OFF + 24) * 16 + 9); }
}
let rq = 0; const redraw = (b) => { if (b) dirtyBase = true; if (!rq) rq = requestAnimationFrame(() => { rq = 0; draw(); }); };

/* ---------- Werkzeuge ---------- */
const TOOLS = [
  ['Boden', [['g', 'Gras'], ['p', 'Weg'], ['w', 'Wasser'], ['wf', 'Wasser fein']]],
  ['Bäume', [['A', 'Baum groß'], ['a', 'Baum klein'], ['C', 'Kirschbaum groß'], ['c', 'Kirschbaum klein'], ['U', 'Beeren-strauch']]],
  ['Blumen', [['1', 'Sonnen-blume'], ['2', 'Blümchen orange'], ['3', 'Blümchen rosa'], ['4', 'Lavendel']]],
  ['Zäune', [['F', 'Holzzaun'], ['W', 'Latten-zaun weiß'], ['R', 'Latten-zaun rosa'], ['S', 'Bretter-zaun'], ['M', 'Stein-mauer'], ['E', 'Hecke']]],
  ['Sonstiges', [['x', 'Entfernen']]],
];
let tool = 'A';
const tbar = document.getElementById('tools');
function icon(id) {
  const c = mkc(16, 20), g = c.getContext('2d');
  if (id === 'g') { g.fillStyle = g.createPattern(GRASS, 'repeat'); g.fillRect(0, 2, 16, 16); }
  else if (id === 'p') { R(g, 0, 2, 16, 16, '#d49a9a'); R(g, 1, 3, 14, 14, '#f1cfc8'); for (let i = 0; i < 9; i++) R(g, 2 + Math.floor(hash(i, 1, 2) * 12), 4 + Math.floor(hash(i, 2, 2) * 12), 1, 1, i % 2 ? '#fff3ef' : '#dba79f'); }
  else if (id === 'w' || id === 'wf') { R(g, 0, 2, 16, 16, '#f5e1c8'); R(g, 1, 3, 14, 14, '#3f86c2'); R(g, 1, 5, 14, 12, '#80c8ef'); R(g, 4, 8, 8, 6, '#62b2e4'); if (id === 'wf') { R(g, 0, 2, 8, 8, 'rgba(255,255,255,.35)'); } }
  else if (id === 'x') { g.strokeStyle = '#c9628f'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(3, 5); g.lineTo(13, 15); g.moveTo(13, 5); g.lineTo(3, 15); g.stroke(); }
  else if (isFence(id)) { g.translate(-22, 5); drawFenceTile(g, 1, 0, (a, b) => b === 0 && a >= 1 && a <= 2, id); drawFenceTile(g, 2, 0, (a, b) => b === 0 && a >= 1 && a <= 2, id); }
  else { const A = SPR[id][0], w = A[0].length, h = A.length; spr(g, SPR[id], 8 - (w >> 1), 20 - h); }
  return c;
}
for (const [name, list] of TOOLS) {
  const grp = document.createElement('div'); grp.className = 'grp';
  for (const [id, label] of list) {
    const b = document.createElement('button'); b.className = 'tool'; b.dataset.t = id;
    const ic = icon(id); ic.style.width = '32px'; ic.style.height = '40px'; b.appendChild(ic);
    const s = document.createElement('span'); s.textContent = label.replace('-', '­'); b.appendChild(s);
    b.onclick = () => { tool = id; panMode(false); document.querySelectorAll('.tool').forEach(t => t.classList.toggle('on', t.dataset.t === tool)); };
    grp.appendChild(b);
  }
  tbar.appendChild(grp);
}
document.querySelector(`.tool[data-t="${tool}"]`).classList.add('on');

const toastEl = document.getElementById('toast'); let tt = 0;
function toast(m) { toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('show'), 1600); }
function waterIn(tx, ty) { ty -= OFF; if (ty < 0 || ty >= 24) return false; for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) if (st.water[ty * 2 + dy][tx * 2 + dx]) return true; return false; }
let lastMsg = '';
function apply(px, py) {   // px,py in Spielpixeln
  if (px < 0 || py < 0 || px >= W || py >= H) return false;
  const tx = px >> 4, ty = py >> 4;
  const warn = m => { if (lastMsg !== m) { toast(m); lastMsg = m; } return false; };
  if (LOCK[ty][tx]) return warn('Hier steht ein Gebäude oder die Kuhweide.');
  const my = ty - OFF;
  if ((tool === 'w' || tool === 'wf') && (my < 0 || my >= 24)) return warn('Wasser geht nur innerhalb der Farm.');
  if (tool === 'wf') { const bx = px >> 3, by = (py - OFF * 16) >> 3; if (st.water[by][bx]) return false; st.water[by][bx] = 1; st.obj[ty][tx] = '.'; return 'b'; }
  if (tool === 'w') { let ch = false; for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) if (!st.water[my * 2 + dy][tx * 2 + dx]) { st.water[my * 2 + dy][tx * 2 + dx] = 1; ch = true; } if (st.obj[ty][tx] !== '.') { st.obj[ty][tx] = '.'; ch = true; } if (st.ground[ty][tx] !== 'g') { st.ground[ty][tx] = 'g'; ch = true; } return ch && 'b'; }
  if (tool === 'g' || tool === 'p') {
    let ch = false; if (my >= 0 && my < 24) for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) if (st.water[my * 2 + dy][tx * 2 + dx]) { st.water[my * 2 + dy][tx * 2 + dx] = 0; ch = true; }
    if (st.ground[ty][tx] !== tool) { st.ground[ty][tx] = tool; ch = true; }
    if (tool === 'p' && st.obj[ty][tx] !== '.' && !isFence(st.obj[ty][tx])) { st.obj[ty][tx] = '.'; ch = true; }
    return ch && 'b';
  }
  if (tool === 'x') { if (st.obj[ty][tx] === '.') return false; st.obj[ty][tx] = '.'; return 'o'; }
  if (waterIn(tx, ty)) return warn('Im Wasser kann nichts stehen.');
  if (!isFence(tool) && st.ground[ty][tx] === 'p') return warn('Auf dem Weg kann nur ein Zaun stehen.');
  if (st.obj[ty][tx] === tool) return false;
  st.obj[ty][tx] = tool; return 'o';
}

/* ---------- Eingabe: malen, zoomen, verschieben ---------- */
let z = Math.max(2, Math.min(6, Math.floor((innerWidth - 24) / W))) || 2;
function setZ(nz, cx, cy) {
  nz = Math.max(1, Math.min(16, Math.round(nz)));
  const r = wrap.getBoundingClientRect(); cx = cx ?? r.left + r.width / 2; cy = cy ?? r.top + r.height / 2;
  const ux = (wrap.scrollLeft + cx - r.left - 12) / z, uy = (wrap.scrollTop + cy - r.top - 12) / z;
  z = nz; cv.style.width = W * z + 'px'; cv.style.height = H * z + 'px';
  wrap.scrollLeft = ux * z + 12 - (cx - r.left); wrap.scrollTop = uy * z + 12 - (cy - r.top);
}
setZ(z);
requestAnimationFrame(() => { wrap.scrollTop = (OFF * 16 - 24) * z; });   // Start: oberer Rand der Farm
let pan = false;
function panMode(on) { pan = on; document.getElementById('pan').classList.toggle('on', on); wrap.style.cursor = on ? 'grab' : 'crosshair'; }
panMode(false);
const pts = new Map(); let pinch = null, drag = null, painting = false, changed = false;
const toPix = e => { const r = cv.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / z), Math.floor((e.clientY - r.top) / z)]; };
function paintAt(e) { const k = apply(...toPix(e)); if (k) { changed = true; if (k === 'b') redraw(true); else redraw(); } }
wrap.addEventListener('pointerdown', e => {
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); wrap.setPointerCapture(e.pointerId);
  if (pts.size === 2) {
    if (painting && changed) { undoStep(true); }
    painting = false; drag = null;
    const a = [...pts.values()], mx = (a[0].x + a[1].x) / 2, my = (a[0].y + a[1].y) / 2, r = wrap.getBoundingClientRect();
    pinch = { d0: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1, z0: z, ux: (wrap.scrollLeft + mx - r.left - 12) / z, uy: (wrap.scrollTop + my - r.top - 12) / z };
  } else if (pts.size === 1) {
    if (pan) drag = { x: e.clientX, y: e.clientY, sl: wrap.scrollLeft, st: wrap.scrollTop };
    else { push(); painting = true; changed = false; lastMsg = ''; paintAt(e); }
  }
});
wrap.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pts.size >= 2) {
    const a = [...pts.values()], mx = (a[0].x + a[1].x) / 2, my = (a[0].y + a[1].y) / 2, d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1, r = wrap.getBoundingClientRect();
    const nz = Math.max(1, Math.min(16, Math.round(pinch.z0 * d / pinch.d0)));
    if (nz !== z) { z = nz; cv.style.width = W * z + 'px'; cv.style.height = H * z + 'px'; }
    wrap.scrollLeft = pinch.ux * z + 12 - (mx - r.left); wrap.scrollTop = pinch.uy * z + 12 - (my - r.top);
  } else if (drag) { wrap.scrollLeft = drag.sl - (e.clientX - drag.x); wrap.scrollTop = drag.st - (e.clientY - drag.y); }
  else if (painting) paintAt(e);
});
const lift = e => {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (!pts.size) { drag = null; if (painting) { painting = false; if (!changed) undo.pop(); else save(); } }
};
wrap.addEventListener('pointerup', lift); wrap.addEventListener('pointercancel', lift);
wrap.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); setZ(z * Math.exp(-e.deltaY * .01), e.clientX, e.clientY); }, { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

/* ---------- Knöpfe ---------- */
function undoStep(silent) { if (!undo.length) return; redo.push(JSON.stringify(st)); st = JSON.parse(undo.pop()); save(); redraw(true); if (!silent) toast('Rückgängig'); }
document.getElementById('undo').onclick = () => undoStep();
document.getElementById('redo').onclick = () => { if (!redo.length) return; undo.push(JSON.stringify(st)); st = JSON.parse(redo.pop()); save(); redraw(true); };
document.getElementById('zi').onclick = () => setZ(z + 1);
document.getElementById('zo').onclick = () => setZ(z - 1);
document.getElementById('pan').onclick = () => panMode(!pan);
document.getElementById('grid').onclick = e => { showGrid = !showGrid; e.currentTarget.classList.toggle('on', showGrid); redraw(); };
document.getElementById('land').onclick = e => { showLand = !showLand; e.currentTarget.classList.toggle('on', showLand); redraw(); };
document.getElementById('reset').onclick = () => { if (confirm('Den Plan auf die Farm im Spiel zurücksetzen? Deine Änderungen gehen verloren.')) { push(); st = clone(ORIG); save(); redraw(true); } };
const dlg = document.getElementById('dlg'), ta = document.getElementById('ta');
function exportText() {
  return 'Farmplan 24x38 v2 (7 Reihen hinter dem Zaun oben, 24 Reihen Farm, 7 Reihen unten)\nBoden (g = Gras, p = Weg):\n' + st.ground.map(r => r.join('')).join('\n') +
    '\nObjekte (A/a Baum groß/klein, C/c Kirschbaum groß/klein, U Beerenstrauch, 1 Sonnenblume, 2 Blümchen orange, 3 Blümchen rosa, 4 Lavendel, F Holzzaun, W Lattenzaun weiß, R Lattenzaun rosa, S Bretterzaun, M Steinmauer, E Hecke, . leer):\n' + st.obj.map(r => r.join('')).join('\n') +
    '\nWasser (48x48, je 8 Pixel):\n' + st.water.map(r => r.join('')).join('\n');
}
let dlgOk = null;
function openDlg(title, text, body, ok) { document.getElementById('dt').textContent = title; document.getElementById('dp').textContent = text; ta.value = body; dlgOk = ok; document.getElementById('dok').style.display = ok ? '' : 'none'; dlg.showModal(); }
document.getElementById('dno').onclick = () => dlg.close();
document.getElementById('dok').onclick = () => { if (dlgOk) dlgOk(ta.value); };
document.getElementById('copy').onclick = async () => {
  const t = exportText();
  try { await navigator.clipboard.writeText(t); toast('Plan kopiert – jetzt im Chat einfügen'); }
  catch (e) { openDlg('Plan kopieren', 'Markiere den Text und kopiere ihn, dann füge ihn im Chat ein.', t, null); ta.select(); }
};
document.getElementById('imp').onclick = () => openDlg('Plan einfügen', 'Füge einen kopierten Farmplan ein.', '', v => {
  const L = v.split(/\r?\n/).map(s => s.trim());
  const i1 = L.findIndex(s => s.startsWith('Boden')), i2 = L.findIndex(s => s.startsWith('Objekte')), i3 = L.findIndex(s => s.startsWith('Wasser'));
  const n = i2 - i1 - 1 === 24 ? 24 : ROWS;
  const g = L.slice(i1 + 1, i1 + 1 + n), o = L.slice(i2 + 1, i2 + 1 + n), w = L.slice(i3 + 1, i3 + 49);
  if (i1 < 0 || i2 < 0 || i3 < 0 || g.some(r => r.length !== 24) || o.some(r => r.length !== 24) || w.length !== 48 || w.some(r => r.length !== 48)) { toast('Das ist kein gültiger Farmplan.'); return; }
  push(); st = pad({ ground: g.map(r => [...r]), obj: o.map(r => [...r]), water: w.map(r => [...r].map(Number)) }); save(); redraw(true); dlg.close(); toast('Plan geladen');
});
draw();
</script>
